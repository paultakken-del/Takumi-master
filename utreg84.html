<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
  body{font-family:monospace;touch-action:none;user-select:none;-webkit-user-select:none}

  /* het speelveld vult het scherm en houdt de verhouding 8 op 5 */
  canvas{position:fixed;inset:0;margin:auto;display:block;background:#000;
         image-rendering:pixelated;image-rendering:crisp-edges;
         width:100%;height:auto;max-width:100%;max-height:100%;aspect-ratio:8/5}

  /* bediening ligt over het beeld, met ruimte voor de ronde schermhoeken */
  #pad{position:fixed;inset:0;pointer-events:none;z-index:10}
  #stick,#fire{position:fixed;pointer-events:auto;opacity:.42;transition:opacity .15s}
  #fire:active,#pad.actief #fire{opacity:.75}
  #stick.zicht:active{opacity:.7}
  #stickzone{position:fixed;left:0;top:0;width:46%;height:100%;pointer-events:auto;z-index:9}
  #stick{width:134px;height:134px;border-radius:50%;background:#141414;border:3px solid #8a8a8a;
         left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
         opacity:0;transition:opacity .12s}       /* pas zichtbaar zodra je hem aanraakt */
  #stick.zicht{opacity:.5}
  #knob{position:absolute;width:56px;height:56px;border-radius:50%;background:#9a9a9a;
        left:35px;top:35px;pointer-events:none}
  #fire{width:112px;height:112px;border-radius:50%;background:#C03028;border:4px solid #FF6050;
        color:#fff;font:bold 15px monospace;line-height:1.2;
        right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
  #sprint{width:78px;height:78px;border-radius:50%;background:#1C4C9C;border:4px solid #5A90E0;
        color:#fff;font:bold 12px monospace;pointer-events:auto;opacity:.42;
        right:calc(env(safe-area-inset-right,0px) + 132px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px)}
  #sprint:active,#pad.actief #sprint{opacity:.75}

  /* knop voor schermvullend, verdwijnt als de app al schermvullend draait */
  #geluid{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);
       left:calc(env(safe-area-inset-left,0px) + 10px);z-index:11;pointer-events:auto;
       background:rgba(0,0,0,.55);color:#ddd;border:1px solid #aa5a5a;border-radius:6px;
       font:11px monospace;padding:6px 9px;opacity:.75}
  #kruis{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);
       right:calc(env(safe-area-inset-right,0px) + 8px);z-index:12;pointer-events:auto;
       width:34px;height:34px;line-height:1;font:16px monospace;
       background:rgba(0,0,0,.32);color:rgba(255,255,255,.72);
       border:1px solid rgba(255,255,255,.35);border-radius:8px;opacity:.55}
  #kruis:active{opacity:.95;background:rgba(0,0,0,.6)}
  #vol{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);
       right:calc(env(safe-area-inset-right,0px) + 50px);z-index:11;pointer-events:auto;
       background:rgba(0,0,0,.5);color:#ddd;border:1px solid #666;border-radius:6px;
       font:11px monospace;padding:6px 9px;opacity:.6}
  body.staat #vol{display:none}

  /* staand vasthouden: vraag om te draaien */
  #draai{position:fixed;inset:0;z-index:20;display:none;background:#0C400C;color:#fff;
         flex-direction:column;align-items:center;justify-content:center;gap:14px;
         font:14px monospace;text-align:center;padding:24px}
  #draai b{font-size:20px;color:#FF8878}
  @media (orientation:portrait) and (pointer:coarse){ #draai{display:flex} }

  /* op een computer geen aanraakbediening */
  @media (hover:hover) and (pointer:fine){
    #pad,#vol{display:none}
    canvas{width:auto;height:100%;max-width:100%}
  }
</style>

    <b>DRAAI JE TOESTEL</b>

  </div>
<script>
(function(){
  const doc=document.documentElement, knop=document.getElementById("vol");
  const staand=window.matchMedia("(display-mode: standalone)");
  const alVol=()=>document.fullscreenElement||document.webkitFullscreenElement
    ||navigator.standalone||staand.matches;
  const merk=()=>document.body.classList.toggle("staat",!!alVol());
  merk();
  document.addEventListener("fullscreenchange",merk);
  knop.addEventListener("click",async()=>{
    try{
      if(doc.requestFullscreen)await doc.requestFullscreen({navigationUI:"hide"});
      else if(doc.webkitRequestFullscreen)doc.webkitRequestFullscreen();
      else knop.textContent="ZET OP BEGINSCHERM";
      if(screen.orientation&&screen.orientation.lock)
        screen.orientation.lock("landscape").catch(()=>{});
    }catch(e){knop.textContent="ZET OP BEGINSCHERM"}
    merk();
  });
  // bediening lichter maken zodra je hem aanraakt
  const pad=document.getElementById("pad");
  const aan=()=>pad.classList.add("actief");
  const uit=()=>setTimeout(()=>pad.classList.remove("actief"),1200);
  for(const el of [document.getElementById("stickzone"),document.getElementById("fire")]){
    el.addEventListener("touchstart",aan,{passive:true});
    el.addEventListener("touchend",uit,{passive:true});
  }
  /* iOS zwijgt bij webaudio als het belknopje op stil staat. Met een afspeelsessie
     en een stil geluidsbestandje schakelt het toestel naar de gewone afspeelstand. */
  const STIL="data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YSADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==";
  const stilAudio=new Audio(STIL);
  stilAudio.loop=true;stilAudio.playsInline=true;stilAudio.setAttribute("playsinline","");
  stilAudio.volume=.01;
  let gewekt=false;
  function wekGeluid(){
    try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
    stilAudio.play().then(()=>{gewekt=true}).catch(()=>{});
    if(window.__wek)try{window.__wek()}catch(e){}
    toonStand();
  }
  const gknop=document.getElementById("geluid");
  function toonStand(){
    const st=window.__audioStand?window.__audioStand():"geen";
    gknop.textContent=st==="running"?"GELUID AAN":"GELUID AANZETTEN";
    gknop.style.borderColor=st==="running"?"#5a9a5a":"#aa5a5a";
  }
  gknop.addEventListener("click",e=>{e.preventDefault();wekGeluid()});
  gknop.addEventListener("touchend",e=>{e.preventDefault();wekGeluid()});
  for(const ev of ["touchend","pointerup","keydown"])
    document.addEventListener(ev,()=>{if(!gewekt)wekGeluid();else if(window.__wek)window.__wek()},{passive:true});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)wekGeluid()});
  setInterval(toonStand,1000);toonStand();

  const kruis=document.getElementById("kruis");
  function sluitOfTerug(e){
    e.preventDefault();
    if(window.__inMenu&&!window.__inMenu()){window.__naarMenu();return}
    // in het menu: venster sluiten, met een nette terugval
    try{window.close()}catch(e2){}
    setTimeout(()=>{
      if(!document.hidden){
        if(history.length>1)history.back();
        else{
          const d=document.getElementById("draai");
          d.style.display="flex";
          d.innerHTML="<b>TOT ZIENS</b><div>Je kunt dit tabblad nu sluiten.</div>";
        }
      }},220);
  }
  kruis.addEventListener("click",sluitOfTerug);
  kruis.addEventListener("touchend",sluitOfTerug);

  /* Tikken op het veld speelt naar de medespeler daar. Alleen in de rechterhelft,
     want links ligt het bedieningsvlak van de knuppel, en niet op de knoppen zelf. */
  const cvv=document.getElementById("c");
  function veldTik(e){
    const t=e.changedTouches?e.changedTouches[0]:e;
    if(!t)return;
    if(t.clientX<window.innerWidth*.46)return;              // linkerhelft is de knuppel
    for(const id of ["fire","sprint","vol","kruis","geluid"]){
      const el2=document.getElementById(id);
      if(!el2)continue;
      const r=el2.getBoundingClientRect();
      if(t.clientX>=r.left-6&&t.clientX<=r.right+6&&t.clientY>=r.top-6&&t.clientY<=r.bottom+6)return;
    }
    const r=cvv.getBoundingClientRect();
    if(r.width<1)return;
    const sx=(t.clientX-r.left)/r.width*320;
    const sy=(t.clientY-r.top)/r.height*200;
    if(window.__tik&&window.__tik(sx,sy))e.preventDefault();
  }
  document.addEventListener("touchstart",veldTik,{passive:false});
  cvv.addEventListener("mousedown",veldTik);

  // dubbeltik zoomt niet
  document.addEventListener("gesturestart",e=>e.preventDefault());
})();
</script>
<script>
"use strict";
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
ctx.imageSmoothingEnabled=false;

/* ===== palet ===== */
const C={blk:"#000000",wht:"#FFFFFF",grass:"#00A000",
  red:"#C83028",blue:"#4850D8",purple:"#A030A8",grey:"#909090",dgrey:"#606060",
  skin:"#F09070",skin2:"#B06048",yel:"#F0E060",lgrey:"#D0D0D0",tan:"#B8A080"};

/* ===== tenues: FC Utrecht 1984 tegen de gasten ===== */
const KITS=[
 {naam:"UTRECHT",kraag:"#FFFFFF",  shirt:"#D82820",light:"#FF8878",sleeve:"#D82820",shorts:"#FFFFFF",sock:"#D82820",sock2:"#FFFFFF",badge:"#FFFFFF"},
 {naam:"WIT",kraag:"#202020",      shirt:"#F0F0F0",light:"#FFFFFF",sleeve:"#F0F0F0",shorts:"#202020",sock:"#F0F0F0",sock2:"#202020",badge:"#202020"},
 {naam:"BLAUW",kraag:"#FFFFFF",    shirt:"#2038B8",light:"#7890FF",sleeve:"#2038B8",shorts:"#FFFFFF",sock:"#2038B8",sock2:"#FFFFFF",badge:"#FFFFFF"},
 {naam:"GEEL",kraag:"#202048",     shirt:"#E0C830",light:"#FFF090",sleeve:"#E0C830",shorts:"#202048",sock:"#E0C830",sock2:"#202048",badge:"#202048"},
 {naam:"GROEN",kraag:"#FFFFFF",    shirt:"#188838",light:"#60D080",sleeve:"#188838",shorts:"#FFFFFF",sock:"#188838",sock2:"#FFFFFF",badge:"#FFFFFF"},
 {naam:"ORANJE",kraag:"#FFFFFF",   shirt:"#E07018",light:"#FFA860",sleeve:"#E07018",shorts:"#202020",sock:"#E07018",sock2:"#FFFFFF",badge:"#202020"},
 {naam:"PAARS",kraag:"#F0F0F0",    shirt:"#8828A0",light:"#C878E0",sleeve:"#8828A0",shorts:"#F0F0F0",sock:"#8828A0",sock2:"#F0F0F0",badge:"#F0F0F0"}];
/* Hoeveel doet het spel voor je? Zoals moderne voetbalspellen dat per onderdeel
   laten kiezen, in plaats van dat ik voor je gok wat prettig speelt. */
let hulpPass=1;     // 1 = zoekt zelf een medespeler, 0 = precies jouw richting
let hulpSchot=1;    // 1 = richt in de zestien op doel, 0 = precies jouw richting
let hulpWissel=1;   // 1 = besturing springt naar wie het dichtst bij de bal is, 0 = alleen op de knop
let tikPas=1;       // 1 = tikken op het veld speelt naar de medespeler daar in de buurt
let kitA=0, kitB=2;
let KIT=[KITS[kitA],KITS[kitB]];
const zetTenues=()=>{KIT[0]=KITS[kitA];KIT[1]=KITS[kitB]};
const SCHEIDS={naam:"SCHEIDS",shirt:"#181818",light:"#181818",sleeve:"#181818",
  shorts:"#181818",sock:"#181818",sock2:"#E8E8E8",badge:"#E8E8E8"};
const KEEP=[
 {shirt:"#309030",sleeve:"#309030",shorts:"#202020",sock:"#202020",sock2:"#B0B0B0",badge:"#309030"},
 {shirt:"#A030A8",sleeve:"#A030A8",shorts:"#202020",sock:"#202020",sock2:"#B0B0B0",badge:"#A030A8"}];

/* ===== veld ===== */
const W={w:1190,top:46,bot:190,gy1:96,gy2:140,gx0:100,gx1:1090};
const midX=W.w/2, midY=(W.top+W.bot)/2;
const SHEAR=0.0;
/* Perspectief met een verdwijnpunt. Dicht bij de camera staan dingen verder uit
   elkaar dan aan de overkant. Een lijn midden in beeld staat daardoor recht,
   terwijl dezelfde lijn aan de rand van het beeld schuin wegloopt. */
const PS=0.854, PK=0.62;
const schaal=wy=>PS*(1+PK*(wy-W.top)/(W.bot-W.top));
const CAMMIN=W.gx0-55, CAMMAX=W.gx1+55;      // je kunt tot achter de doelen kijken
let cam=(W.gx0+W.gx1)/2;
const SX=(wx,wy)=>Math.round(160+(wx-cam)*schaal(wy));
const camWens=x=>Math.max(CAMMIN,Math.min(CAMMAX,x));

/* ===== geluid ===== */
let AC=null,snd=true;
function ac(){
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();       // iOS start opgeschort
  return AC}
window.__wek=ac;
/* Tikken op het veld speelt de bal naar de medespeler het dichtst bij je vinger.
   Je wijst dus aan waar de bal heen moet, in plaats van te mikken met de stick. */
window.__tik=(sx,sy)=>{
  if(!tikPas||state!=="play")return false;
  const p=ctrl[0];
  if(!p||p.role==="K"||p.cool>0)return false;
  if(dist(p,ball)>20||ball.z>14)return false;         // je moet wel aan de bal zijn
  const wy=Math.max(W.top,Math.min(W.bot,sy));
  const wx=cam+(sx-160)/schaal(wy);

  if(muziekTimer){clearTimeout(muziekTimer);muziekTimer=null}

  if(!snd)return;
  if(deunNu===naam&&muziekBronnen.length)return;
  stopMuziek();deunNu=naam;
  try{
    const a=ac(), t0=a.currentTime+.06;
    const uit=a.createGain();uit.gain.value=.075;uit.connect(a.destination);
    let eind=0;
    for(const stem of deun){
      const o=a.createOscillator();o.type=stem.golf||"square";
      const g=a.createGain();g.gain.value=0;
      if(stem.detune)o.detune.value=stem.detune;
      o.connect(g);g.connect(uit);
      let t=t0;
      for(const [n,d] of stem.noten){
        const dur=d*(60/deun.tempo);
        if(n!==null){
          o.frequency.setValueAtTime(toon(n),t);
          g.gain.setValueAtTime(0,t);
          g.gain.linearRampToValueAtTime(stem.vol,t+.012);          // scherpe aanslag
          g.gain.setValueAtTime(stem.vol*.8,t+dur*.55);
          g.gain.linearRampToValueAtTime(0,t+dur*.92);

      }
      o.start(t0);o.stop(t+.15);muziekBronnen.push(o);
      eind=Math.max(eind,t-t0);

    if(herhaal)muziekTimer=setTimeout(()=>{deunNu="";speelDeun(deun,naam,true)},eind*1000);

const clampP=p=>{p.x=Math.max(W.gx0+5,Math.min(W.gx1-5,p.x));
  p.y=Math.max(W.top-4,Math.min(W.bot+4,p.y))};

/* ===== balacties ===== */
const isHuman=p=>humans().includes(p.team)&&p===ctrl[p.team];
function inward(p,vy){        // computerspelers spelen de bal niet zomaar de zijlijn over
  if(isHuman(p))return vy;
  if(ball.y<W.top+16&&vy<0)return -vy;
  if(ball.y>W.bot-16&&vy>0)return -vy;
  return vy}
let aiPace=34;
function dribble(p,dt){         // bal blijft voor de voet en volgt jouw eigen snelheid
  const d=D8[p.dir];
  const ver=(humans().includes(p.team)&&p===ctrl[p.team]&&K["s"+p.team])?17:10;
  const tx=p.x+d[0]*ver, ty=p.y+d[1]*(ver*.7)+2;
  const k=Math.min(1,22*dt);              // bal zwenkt vlot mee bij het keren
  ball.x+=(tx-ball.x)*k;ball.y+=(ty-ball.y)*k;
  ball.z=0;ball.vz=0;
  ball.vx=p.mvx||0;ball.vy=p.mvy||0;      // sta je stil, dan ligt de bal stil
  ball.last=p;ball.touch=0;
  if(!p.tick||p.tick<=0){p.tick=.28;beep(520,.035,"square",.025)}
  p.tick-=dt}
function nudge(p,speed){
  const d=D8[p.dir];
  ball.vx=d[0]*speed;ball.vy=inward(p,d[1]*speed*.55);ball.vz=0;
  ball.last=p;ball.touch=.1;beep(520,.04,"square",.03)}
function kick(p,power,loft){        // korte druk is vlak, lang vasthouden geeft een hoge bal
  const centraal=Math.abs(p.y-midY)<34;              // vanaf de flank een voorzet, centraal een schot
  const dichtbij=Math.abs(foeGoal(p.team)-p.x)<230&&centraal;
  const d=D8[p.dir];
  const sp=(power||1)*(loft?(dichtbij?205:150):200);
  ball.vx=d[0]*sp;ball.vy=inward(p,d[1]*sp*.55);
  ball.vz=loft?(dichtbij?108:92):0;
  ball.last=p;ball.touch=.25;p.cool=.28;beep(loft?260:400,.1,"square",.07)}
/* Balbehandeling: de kracht loopt vloeiend mee met hoe lang je drukt.
   Een pass zoekt een medespeler, een voorzet mikt op de zestien, een schot volgt je kijkrichting. */
/* De zwaartekracht is 210, dus een bal die met snelheid v omhoog gaat haalt
   een tophoogte van v*v/420. Hieronder rekenen we met de tophoogte in pixels. */
const vzVoor=top=>Math.sqrt(420*Math.max(0,top));
let eenTwee=null, eenTweeT=0;      // wie mag de bal terugvragen na zijn eigen pass
let balDoel=null, balDoelT=0;      // wie is er aangespeeld
function balNaar(p,tx,ty,hoogte,minSp){
  const dx=tx-p.x, dy=ty-p.y;
  const l=Math.hypot(dx,dy)||1;
  let sp;
  if(hoogte>8){                                    // boogbal: snelheid past bij de vluchttijd
    const T=2*hoogte/210;                           // hoe lang hij in de lucht is
    sp=Math.max(minSp||90,Math.min(300,l/Math.max(.3,T*.86)));
  }else{                                            // rollende bal: snelheid past bij de afstand
    /* Gemeten: een bal met beginsnelheid v rolt ongeveer (v-77)*2,1 ver.
       Omgekeerd is de snelheid voor afstand d dus ruwweg 80 + d*0,49. */
    sp=Math.max(minSp||90,Math.min(285,82+l*.5));
  }
  p.dir=dirOf(dx,dy);
  ball.vx=dx/l*sp;ball.vy=inward(p,dy/l*sp);ball.vz=hoogte;
  ball.last=p;ball.touch=.25;p.cool=.28;
  beep(hoogte>25?260:400,.1,"square",.07)}
/* Zoekt altijd iemand om aan te spelen. Eerst in de kegel voor je uit; vindt hij
   daar niemand, dan de best bereikbare medespeler waar dan ook. Hij meldt er ook
   bij hoe gedekt de speellijn is, want daar wordt de hoogte van de pass op gekozen. */
function speellijn(p,q){
  const dx=q.x-p.x, dy=q.y-p.y, l=Math.hypot(dx,dy)||1;
  let dekking=0, dichtste=1e9;
  for(const o of P){
    if(o.team===p.team||o.role==="K")continue;
    const s=((o.x-p.x)*dx+(o.y-p.y)*dy)/(l*l);
    if(s<=.08||s>=1.05)continue;
    const afw=Math.hypot(o.x-(p.x+dx*s),(o.y-(p.y+dy*s))*3.2);
    if(afw<28)dekking++;
    if(afw<dichtste)dichtste=afw}
  return {dekking,dichtste}}
function medespeler(p,maxAfst){
  const d=D8[p.dir];
  let best=null,bs=1e9,noodBest=null,noodBs=1e9;
  for(const q of P){
    if(q.team!==p.team||q===p||q.role==="K")continue;
    const dx=q.x-p.x, dy=q.y-p.y;
    const af=Math.hypot(dx,dy*3.2);
    if(af<18)continue;
    const l=Math.hypot(dx,dy)||1;
    const richting=(dx/l)*d[0]+(dy/l)*d[1];
    const lijn=speellijn(p,q);
    const punt=af*(1.9-richting)*(1+lijn.dekking*.9);
    if(af<=maxAfst*1.6&&richting>-.4&&punt<noodBs){   // terugvaloptie, ook opzij of achter
      noodBs=punt;noodBest={q,dekking:lijn.dekking,dichtste:lijn.dichtste,af}}
    if(af>maxAfst||richting<.25)continue;             // voor je uit telt eerst
    if(punt<bs){bs=punt;best={q,dekking:lijn.dekking,dichtste:lijn.dichtste,af}}}
  return best||noodBest}
function speelBal(p,hold){
  const t=Math.max(0,Math.min(1,hold));
  if(hulpSchot&&inVak(p)&&t>=.18)return opDoel(p,245+t*75,3+t*11);   // in de zestien is het een schot
  const gx=foeGoal(p.team), naarDoel=Math.abs(gx-p.x);
  const centraal=Math.abs(p.y-midY)<34;
  const d=D8[p.dir];
  if(t<.5){                                         // pass: zoekt een medespeler
    const keuze=hulpPass?medespeler(p,140+t*560):null;
    if(keuze){
      const m=keuze.q;
      /* In de loop spelen: hij komt de bal tegemoet, dus mikken we een stuk
         vóór hem in de aanvalsrichting, plus zijn eigen beweging. */
      const ruw=Math.hypot(m.x-p.x,(m.y-p.y)*3.2);
      const vooruit=(m.x-p.x)*attack[p.team];
      const voor=vooruit>10?(8+Math.min(26,ruw*.10)):0;   // alleen in de loop als hij ook vooruit staat
      const tx=m.x+(m.mvx||0)*.35+attack[p.team]*voor,
            ty=m.y+(m.mvy||0)*.35;
      const afst=Math.hypot(tx-p.x,(ty-p.y)*3.2);
      /* Hoogte op maat: over een gedekte lijn heen een boogje, bij een lange bal
         een lichte boog, en bij een vrije korte pass gewoon over het gras. */
      let top;
      if(keuze.dekking>0)        top=Math.max(20,afst*.12);   // er echt overheen
      else if(keuze.dichtste<40) top=13;
      else if(afst>300)          top=11;
      else                       top=t<.24?0:(t-.24)*70;
      balDoel=m;balDoelT=1.8;
      if(isHuman(p)){eenTwee=p;eenTweeT=1.1}      // venster om de bal terug te vragen
      return balNaar(p,tx,ty,vzVoor(top),74)}
    return balNaar(p,p.x+d[0]*(60+t*420),p.y+d[1]*(25+t*140),
                   vzVoor(t<.24?0:(t-.24)*70),95)}
  if(!centraal&&naarDoel<420){                      // voorzet: landt voor het doel
    const mik=gx-Math.sign(gx-p.x)*95;
    return balNaar(p,mik,midY+(p.y<midY?6:-6),vzVoor(22+(t-.5)*14),120)}
  if(centraal&&naarDoel<260){                       // schot: volgt je kijkrichting
    const kracht=270+(t-.5)*81;                     // een tiende zachter dan eerst
    const hoogte=vzVoor(13+(t-.5)*32);
    ball.vx=d[0]*kracht;ball.vy=inward(p,d[1]*kracht*.55);ball.vz=hoogte;
    ball.last=p;ball.touch=.25;p.cool=.28;
    return beep(hoogte>25?300:430,.11,"square",.08)}
  const hoog=vzVoor(21+(t-.5)*18);                  // lange bal vooruit
  return balNaar(p,p.x+d[0]*300,p.y+d[1]*90,hoog,170)}
function inVak(p){                 // sta je in het strafschopgebied van de tegenstander?
  const b=boxUit(1-p.team);
  return (p.x-b.gx)*b.d>=-6&&(p.x-b.rand)*b.d<=0&&p.y>b.y1-4&&p.y<b.y2+4}
/* In de zestien wordt elke haal automatisch op doel gericht. Je kijkrichting kiest
   alleen nog de hoek, net als bij een strafschop. Anders moet je in het gedrang
   ook nog precies staan te draaien en dat lukt nooit. */
function opDoel(p,kracht,top){
  stat.schoten[p.team]++;
  const gx=foeGoal(p.team), d=D8[p.dir];
  let mikY=p.y+d[1]*15;                  // jouw eigen lijn is het uitgangspunt
  mikY=Math.max(W.gy1+5,Math.min(W.gy2-5,mikY));
  const dx=gx-p.x, dy=mikY-p.y, l=Math.hypot(dx,dy)||1;
  p.dir=dirOf(dx,dy);
  ball.z=Math.min(ball.z,24);
  ball.vx=dx/l*kracht;ball.vy=dy/l*kracht;ball.vz=vzVoor(top);
  ball.last=p;ball.touch=.28;p.cool=.3;
  beep(430,.11,"square",.08)}
function volley(p,hold){          // bal uit de lucht op de slof nemen
  const t=Math.max(0,Math.min(1,hold));
  if(hulpSchot&&inVak(p))return opDoel(p,240+t*80,2+t*9);   // in de zestien meteen op doel
  const d=D8[p.dir], kracht=235+t*95;
  ball.vx=d[0]*kracht;ball.vy=inward(p,d[1]*kracht*.55);
  ball.vz=vzVoor(2+t*11);
  ball.last=p;ball.touch=.28;p.cool=.3;
  beep(360,.12,"square",.09)}
function omhaal(p){            // acrobatische haal bij een bal boven je hoofd
  const gx=foeGoal(p.team), d=D8[p.dir];
  let mikY=p.y+d[1]*14;
  mikY=Math.max(W.gy1+5,Math.min(W.gy2-5,mikY));
  const naarDoel=Math.abs(gx-p.x)<340;
  const dx=naarDoel?(gx-p.x):d[0]*200, dy=naarDoel?(mikY-p.y):d[1]*60;
  const l=Math.hypot(dx,dy)||1;
  p.dir=dirOf(dx,dy);
  ball.z=Math.min(ball.z,44);
  ball.vx=dx/l*250;ball.vy=dy/l*250;ball.vz=vzVoor(9);
  ball.last=p;ball.touch=.3;p.cool=.5;p.dive=.55;       // hij gaat er even bij liggen
  beep(520,.13,"square",.09)}
function headShot(p){               // lange klik bij een hoge bal: harde kopstoot
  if(hulpSchot&&inVak(p))return opDoel(p,235,4);            // in de zestien kop je op doel
  const d=D8[p.dir];
  ball.z=Math.min(ball.z,22);
  ball.vx=d[0]*240;ball.vy=inward(p,d[1]*240*.5);ball.vz=vzVoor(4);
  ball.last=p;ball.touch=.25;p.cool=.26;beep(560,.09,"square",.07)}
function head(p){                   // korte klik: gecontroleerde kopbal
  const d=D8[p.dir], near=Math.abs(foeGoal(p.team)-p.x)<150;
  /* Opzwiepen is bedoeld als truc, niet als manier van voortbewegen: de bal komt
     lager terug en je speler heeft even nodig voordat hij weer kan koppen. */
  const sp=near?235:34;
  if(!near)p.cool=.34;
  ball.z=Math.min(ball.z,12);
  ball.vx=d[0]*sp;ball.vy=inward(p,d[1]*sp*.5);
  ball.vz=near?14:vzVoor(7);           // komt zo laag terug dat jongleren stopt
  ball.last=p;ball.touch=.2;p.cool=.16;beep(760,.07,"triangle",.06)}
function goal(team){scorer=team;score[team]++;state="goal";stateT=0;
  const maker=ball.last&&ball.last.team===team?ball.last:null;
  if(maker&&team===0){
    if(!maker.naam)maker.naam=NAMEN[(P.indexOf(maker)*3+2)%NAMEN.length];
    msg=maker.naam+" SCOORT!";
  }else msg="GOAL!";
  speelDeun(GOALDEUN,"goal",false);
  ball.held=null;whistle();cheer();for(const p of P)if(p.team===team)p.cel=1}
function tackle(p,foe){        // sliding: op tijd is balafname, te laat is een overtreding
  p.cool=.55;
  const d0=D8[p.dir];p.x+=d0[0]*7;p.y+=inward(p,d0[1]*5);clampP(p);   // hij schuift vooruit
  beep(200,.09,"square",.05);
  /* Ruime marges: je komt al snel "bij de bal" en je bent pas van achteren als
     je er duidelijk achter zit. Zo blijft een tackle meestal gewoon een tackle. */
  const bijBal=Math.hypot(p.x-ball.x,(p.y-ball.y)*1.7)<40&&ball.z<16&&!ball.held;
  const vanAchter=(p.x-foe.x)*attack[foe.team]<-14;
  if(bijBal&&!vanAchter&&Math.random()<.90){    // schoon: jij glijdt, hij blijft staan
    p.dive=.35;
    const d=D8[p.dir];
    ball.vx=d[0]*70;ball.vy=inward(p,d[1]*70);ball.vz=0;   // bal blijft in de buurt
    ball.last=p;ball.touch=.3;foe.cool=.55;                // hij is even uitgespeeld
    beep(300,.07,"square",.06);return}
  if(!vanAchter&&Math.random()<.7){            // net mis, maar geen overtreding
    p.cool=.8;return}
  foe.dive=1.1;foe.cool=1.1;                    // te laat: de tegenstander gaat neer
  const w=Math.sign(foe.x-p.x)||1;
  foe.x+=w*5;clampP(foe);

let stat={bezit:[0,0],schoten:[0,0],corners:[0,0]};   // wedstrijdcijfers voor de rust
let fluitRust=0;
let penT=0;        // klok voor het bewegende mikpunt bij een strafschop                               // niet twee keer kort achter elkaar fluiten
function overtreding(dader,slachtoffer){       // vrije trap, of strafschop in de zestien
  if(fluitRust>0){dader.cool=.8;return}
  fluitRust=6;
  whistle();
  const ploeg=slachtoffer.team;
  const b=boxUit(dader.team);
  const inEigenZestien=(ball.x-b.gx)*b.d>=0&&(ball.x-b.rand)*b.d<=0&&
                       ball.y>b.y1&&ball.y<b.y2;
  dader.cool=1.2;
  if(inEigenZestien&&dader.team!==ploeg){
    const stip=b.gx+b.d*110;
    setPiece("penalty",ploeg,stip,midY);
    msg="STRAFSCHOP";
  }else{
    setPiece("freekick",ploeg,
      Math.max(W.gx0+30,Math.min(W.gx1-30,ball.x)),
      Math.max(W.top+6,Math.min(W.bot-6,ball.y)));
    msg="VRIJE TRAP";
  }}
function setPiece(type,team,x,y){
  setType=type;ball.x=x;ball.y=y;ball.z=0;ball.vx=ball.vy=ball.vz=0;ball.held=null;ball.touch=0;
  let t=null;
  if(type==="goalkick")t=P.find(p=>p.team===team&&p.role==="K");
  else if(type==="penalty"){                    // de beste spits neemt hem
    t=P.filter(p=>p.team===team&&p.role==="F")
       .sort((a,b)=>Math.abs(a.y-midY)-Math.abs(b.y-midY))[0]
      ||P.find(p=>p.team===team&&p.role!=="K")}
  else{let bd=1e9;for(const p of P){if(p.team!==team||p.role==="K")continue;
    const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;t=p}}}
  t.x=x-(type==="throwin"?0:9*attack[team]);
  t.y=y+(type==="throwin"?6*(y<midY?1:-1):0);
  t.cool=0;t.charge=0;t.dir=dirOf(foeGoal(team)-t.x,midY-t.y);
  taker=t;takerT=0;ctrl[team]=t;
  state="setpiece";stateT=0;
  msg=type==="throwin"?"INWORP":type==="corner"?"CORNER":
      type==="penalty"?"STRAFSCHOP":type==="freekick"?"VRIJE TRAP":"DOELTRAP";
  if(type!=="freekick"&&type!=="penalty")whistle()}
/* Afstanden bij hervattingen. Het veld is 940 bij 153, dus ongeveer 9 pixels
   per meter in de breedte en 2,2 in de diepte. Daarom telt diepte vier keer zwaarder. */
const AFSTAND={corner:82,throwin:32,goalkick:0,freekick:82,penalty:82};
function boxUit(t){                      // strafschopgebied: 16,5 bij 40,3 meter
  const gx=ownGoal(t), d=attack[t]>0?1:-1;
  return {gx,d,rand:gx+d*165,y1:W.gy1-42,y2:W.gy2+42}}
function teDichtbij(p){
  if(!taker)return false;
  if(p===taker||p.role==="K")return false;
  if(setType!=="goalkick"&&setType!=="penalty"&&p.team===taker.team)return false;
  if(setType==="penalty"){                        // alleen nemer en keeper in de zestien
    if(p.role==="K")return false;
    const b=boxUit(taker.team===0?1:0);
    const inBox=(p.x-b.gx)*b.d>=-2&&(p.x-b.rand)*b.d<=0&&p.y>b.y1&&p.y<b.y2;
    return inBox||Math.hypot(p.x-ball.x,(p.y-ball.y)*4)<82}
  if(setType==="goalkick"){                       // bij een doeltrap moet iedereen eruit
    const b=boxUit(taker.team);
    return (p.x-b.gx)*b.d>=-2&&(p.x-b.rand)*b.d<=0&&p.y>b.y1&&p.y<b.y2}
  const need=AFSTAND[setType]||32;
  return Math.hypot(p.x-ball.x,(p.y-ball.y)*4)<need}
function keeperRuimte(dt){               // bal in de handen van de keeper: zestien vrijmaken
  const gk=ball.held;
  if(!gk||gk.role!=="K")return;
  const b=boxUit(gk.team);
  for(const p of P){
    if(p.team===gk.team||p.role==="K")continue;
    const inBox=(p.x-b.gx)*b.d>=-2&&(p.x-b.rand)*b.d<=0&&p.y>b.y1&&p.y<b.y2;
    if(!inBox)continue;
    p.x+=b.d*80*dt;
    p.moving=true;p.anim+=dt*6;p.walkT=.18;clampP(p)}}
function houdAfstand(dt){                // tegenstanders wijken tot ze ver genoeg staan
  if(state!=="setpiece"||!taker)return true;
  let vrij=true;
  for(const p of P){
    if(!teDichtbij(p))continue;
    vrij=false;
    if(setType==="goalkick"||setType==="penalty"){
      const b=boxUit(setType==="penalty"?(taker.team===0?1:0):taker.team);
      p.x+=b.d*74*dt;                            // van de doellijn af, het gebied uit
    }else{
      let dx=p.x-ball.x, dy=p.y-ball.y;
      let n=Math.hypot(dx,dy);
      if(n<7){                                   // pal op de nemer: vaste uitwijkrichting
        dx=(p.x<=ball.x?-1:1);
        dy=(ball.y<midY?1:-1)*.6;
        n=Math.hypot(dx,dy);
      }
      p.x+=dx/n*95*dt;p.y+=dy/n*95*dt*.35;
    }
    p.moving=true;p.anim+=dt*6;p.walkT=.18;
    clampP(p);
  }
  return vrij}
function release(p){
  if(setType==="penalty"){

       Anders schiet je bij omhoog sturen recht naar de zijlijn. */
    /* Het mikpunt zwiept langs de doellijn; waar het staat als je drukt, daar gaat
       de bal heen. Een strafschop is daarmee een kwestie van timing. */
    const gx=foeGoal(p.team);
    const mikY=humans().includes(p.team)
      ? midY+Math.sin(penT*2.6)*((W.gy2-W.gy1)/2-2)
      : midY+(Math.random()-.5)*24;
    /* Wrijving remt beide richtingen even hard af, dus de bal loopt rechtdoor.
       Mik daarom simpelweg vanaf de bal naar het mikpunt op de doellijn. */
    const dx=gx-ball.x, dy=mikY-ball.y, l=Math.hypot(dx,dy)||1;
    p.dir=dirOf(dx,dy);
    ball.vx=dx/l*310;ball.vy=dy/l*310;
    ball.vz=vzVoor(6);ball.last=p;ball.touch=.3;p.cool=.3;
    beep(430,.11,"square",.08);
    taker=null;state="play";msg="";return}
  // de bal komt automatisch in het spel, naar de best geplaatste medespeler
  const ver=setType==="goalkick";               // een doeltrap gaat het veld in, niet naar de dichtstbijzijnde
  let mate=null,md=ver?-1:1e9;
  for(const q of P){if(q.team!==p.team||q===p||q.role==="K")continue;
    const vooruit=(q.x-p.x)*attack[p.team];
    if(vooruit<-30)continue;
    const d=dist(p,q);
    if(ver){if(vooruit>md){md=vooruit;mate=q}}
    else if(d<md&&d>25){md=d;mate=q}}
  const tx=setType==="corner"?foeGoal(p.team):(mate?mate.x:p.x+attack[p.team]*120);
  const ty=setType==="corner"?midY:(mate?mate.y:midY);
  p.dir=dirOf(tx-p.x,ty-p.y);
  if(setType==="throwin"){
    ball.verbod=p;ball.verbodT=2.2;              // de inwerper mag hem niet zelf terugpakken
    const d=D8[p.dir], inw=p.y<midY?1:-1;
    let dy=d[1];if(dy*inw<.2)dy=inw*.5;
    const l=Math.hypot(d[0],dy)||1;
    ball.x=p.x;ball.y=p.y;ball.z=32;
    ball.vx=d[0]/l*62;ball.vy=dy/l*62;ball.vz=34;   // een worp, geen trap
    ball.last=p;ball.touch=.4;p.cool=.7;beep(300,.1,"triangle",.05)}
  else if(mate){
    /* Een vrije trap, corner of inworp is gewoon een pass: kracht op de afstand,
       en alleen een boogje als er iemand in de lijn staat. */
    const lijn=speellijn(p,mate);
    const afst=Math.hypot(mate.x-p.x,(mate.y-p.y)*3.2);
    let top;
    if(setType==="goalkick")      top=32;
    else if(setType==="corner")   top=Math.max(24,afst*.15);
    else if(lijn.dekking>0)       top=Math.max(22,afst*.14);
    else if(afst>150)             top=13;
    else                          top=0;
    balNaar(p,mate.x+(mate.mvx||0)*.4,mate.y+(mate.mvy||0)*.4,
            vzVoor(top),setType==="goalkick"?200:88);
    balDoel=mate;balDoelT=1.8;
  }
  else kick(p,setType==="corner"?.85:.6,true);
  taker=null;state="play";msg=""}

/* ===== update ===== */
function update(dt){
  stateT+=dt;
  if(state==="menu"||state==="halftime"||state==="fulltime"){fireEdge[0]=fireEdge[1]=false;sprintEdge[0]=sprintEdge[1]=false;return}
  if(state==="goal"){
    for(const p of P)if(p.cel){p.anim+=dt*10;p.moving=true;p.x+=attack[p.team]*24*dt;
      p.dir=attack[p.team]>0?0:4;clampP(p)}
    ballPhysics(dt);
    filmT-=dt;
    if(filmT<=0){filmT=1/30;film.push(maakBeeldje());if(film.length>130)film.shift()}
    if(stateT>2.4){
      const nodig=Math.round(HER_FPS*HER_SEC*HER_TRAAG);   // zes seconden op halve snelheid
      if(film.length>30){herhaling=film.slice(-nodig);herIdx=0;state="herhaling";stateT=0;msg=""}
      else{reset(scorer===0?1:0);state="kickoff";stateT=0;whistle()}}
    fireEdge[0]=fireEdge[1]=false;sprintEdge[0]=sprintEdge[1]=false;return}
  if(state==="herhaling"){                     // op halve snelheid terugkijken
    if(!herhaling||!herhaling.length||fireEdge[0]||fireEdge[1]||herIdx>=herhaling.length-1){
      film=[];herhaling=null;reset(scorer===0?1:0);state="kickoff";stateT=0;whistle();
      fireEdge[0]=fireEdge[1]=false;sprintEdge[0]=sprintEdge[1]=false;return}
    zetBeeldje(herIdx);
    herIdx+=dt*HER_FPS*HER_TRAAG;               // halve snelheid
    fireEdge[0]=fireEdge[1]=false;sprintEdge[0]=sprintEdge[1]=false;return}
  if((state==="entry"||state==="kickoff")&&fireEdge[0]){    // snelstart
    if(state==="entry")for(const p of [...P,ref]){p.x=p.spotX;p.y=p.spotY;p.wacht=0;p.moving=false;p.walkT=0}
    state="play";msg="";stateT=0;whistle();
    fireEdge[0]=fireEdge[1]=false}
  if(state==="ceremonie"){                      // huldiging in de middencirkel
    for(const p of P){
      p.moving=false;
      if(p.team!==winnaar){p.walkT=0;continue}
      const dx=p.spotX-p.x, dy=p.spotY-p.y, l=Math.hypot(dx,dy);
      if(l>3){p.x+=dx/l*52*dt;p.y+=dy/l*52*dt*.72;turn(p,dx,dy,dt);
        p.anim+=dt*6;p.moving=true;p.cel=0}
      else{p.dir=2;p.cel=1}
      p.walkT=p.moving?.18:Math.max(0,(p.walkT||0)-dt);
      clampP(p)}
    const wc=camWens(midX);
    cam+=(wc-cam)*Math.min(1,3*dt);
    msg=stateT>3?"HULDIGING":"";
    if(stateT>9||fireEdge[0]){state="fulltime";msg=""}
    fireEdge[0]=fireEdge[1]=false;sprintEdge[0]=sprintEdge[1]=false;return}
  if(state==="entry"){                          // de ploegen lopen het veld op
    let klaar=true;
    for(const p of [...P,ref]){
      p.moving=false;
      if(p.wacht>0){p.wacht-=dt;klaar=false;
        p.walkT=Math.max(0,(p.walkT||0)-dt);continue}
      const dx=p.spotX-p.x, dy=p.spotY-p.y, l=Math.hypot(dx,dy);
      if(l>3){klaar=false;
        p.x+=dx/l*52*dt;p.y+=dy/l*52*dt*.8;      // geen veldbegrenzing tijdens de opkomst
        turn(p,dx,dy,dt);p.anim+=dt*5;p.moving=true}
      p.walkT=p.moving?.18:Math.max(0,(p.walkT||0)-dt)}
    msg=stateT<4?"DE PLOEGEN KOMEN OP":"";
    const w=camWens(midX);
    cam+=(w-cam)*Math.min(1,3*dt);
    if((klaar&&stateT>2.5)||stateT>9){state="kickoff";stateT=0;whistle()}
    fireEdge[0]=fireEdge[1]=false;sprintEdge[0]=sprintEdge[1]=false;return}
  if(state==="kickoff"){msg="AFTRAP";if(stateT>.7){state="play";msg="";aftrapVrij=1.4}}
  if(state==="play"){clock+=dt*MPS;
    if(half===1&&clock>=200){state="halftime";whistle();speelDeun(RUSTDEUN,"rust",false);fireEdge[0]=fireEdge[1]=false;sprintEdge[0]=sprintEdge[1]=false;return}
    if(half===2&&clock>=400){whistle();cheer();
      if(score[0]===score[1]){state="fulltime";speelDeun(RUSTDEUN,"einde",false);fireEdge[0]=fireEdge[1]=false;sprintEdge[0]=sprintEdge[1]=false;return}
      winnaar=score[0]>score[1]?0:1;
      P.filter(p=>p.team===winnaar).forEach((p,i)=>{p.spotX=midX-58+i*20;p.spotY=midY+10});
      state="ceremonie";stateT=0;msg="";speelDeun(ZEGEDEUN,"zege",true);
      fireEdge[0]=fireEdge[1]=false;sprintEdge[0]=sprintEdge[1]=false;return}}

  const hum=humans();
  ball.rust=Math.max(0,(ball.rust||0)-dt);
  if(ball.last&&ball.last.team!==bezitTeam){    // net veroverd: even niet terugpakken
    bezitTeam=ball.last.team;ball.rust=.9;balDoel=null;balDoelT=0}
  ball.verbodT=Math.max(0,(ball.verbodT||0)-dt);
  if(ball.verbodT<=0)ball.verbod=null;
  if(ball.verbod&&ball.last&&ball.last!==ball.verbod)ball.verbodT=0;  // ander raakte hem: weer vrij
  /* Zolang de bal onderweg is blijft de ontvanger hem tegemoet lopen. Anders
     verloopt zijn klok terwijl de bal nog rolt en blijft die ergens liggen. */
  if(balDoel&&Math.hypot(ball.vx,ball.vy)>25)balDoelT=Math.max(balDoelT,.5);
  balDoelT=Math.max(0,balDoelT-dt);
  if(balDoelT<=0)balDoel=null;
  if(balDoel&&ball.last===balDoel)balDoel=null;   // aangekomen
  if(state==="play"&&ball.last)stat.bezit[ball.last.team]++;
  fluitRust=Math.max(0,fluitRust-dt);
  eenTweeT=Math.max(0,eenTweeT-dt);
  if(eenTweeT<=0)eenTwee=null;
  if(state==="setpiece"&&setType==="penalty")penT+=dt;else penT=0;
  for(const t of [0,1])pogingT[t]=Math.max(0,pogingT[t]-dt);
  aftrapVrij=Math.max(0,aftrapVrij-dt);
  for(const t of [0,1])lockT[t]=Math.max(0,lockT[t]-dt);
  for(const t of hum)if(state!=="setpiece")ctrl[t]=ctrlFor(t);
  const aiSpd=46+level*2.2, kpSpd=19+level*2.7, spread=48-level*4.4;
  aiPace=aiSpd*.72;

  for(const p of P){
    p.cool-=dt;p.dive=Math.max(0,p.dive-dt);p.moving=false;
    const ox0=p.x, oy0=p.y;

    if(hum.includes(p.team)&&p===ctrl[p.team])human(p,dt);
    else if(p.role==="K"&&!(state==="setpiece"&&taker===p))keeper(p,dt,kpSpd);
    else if(!(state==="setpiece"&&taker===p))ai(p,dt,aiSpd,spread);   // de nemer blijft staan
    p.mvx=(p.x-ox0)/dt;p.mvy=(p.y-oy0)/dt;   // werkelijke snelheid, voor de bal aan de voet
    p.walkT=p.moving?.18:Math.max(0,(p.walkT||0)-dt);
    clampP(p)}

  /* lichamen botsen, keeper staat vast */
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const a=P[i],b=P[j];
    const dx=b.x-a.x,dy=(b.y-a.y)*1.7,dd=Math.hypot(dx,dy);
    if(dd>=24||dd<.01)continue;
    const push=(24-dd)/2,ux=dx/dd,uy=dy/dd/1.7;
    const ak=a.role==="K",bk=b.role==="K";
    if(ak&&bk)continue;
    if(ak){b.x+=ux*push*2;b.y+=uy*push*2;clampP(b)}
    else if(bk){a.x-=ux*push*2;a.y-=uy*push*2;clampP(a)}
    else{a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push;clampP(a);clampP(b)}}

  losseBal(dt);
  refLoopt(dt);
  keeperRuimte(dt);
  if(state==="setpiece"&&taker){takerT+=dt;
    const vrij=houdAfstand(dt);
    const zelf=humans().includes(taker.team);      // ruimte om zelf te kiezen
    const wacht=zelf?1.6:1.1, uiterste=zelf?6:2.6;
    if((vrij&&takerT>wacht)||takerT>uiterste)release(taker)}

  filmT-=dt;                                   // beeldje bewaren, dertig per seconde
  if(filmT<=0){filmT=1/30;film.push(maakBeeldje());if(film.length>130)film.shift()}
  ballPhysics(dt);
  if(state==="play")contacts(dt);
  if(state==="play")outOfPlay();

  const want=camWens(ball.x);
  cam+=(want-cam)*Math.min(1,5*dt);
  fireEdge[0]=fireEdge[1]=false;sprintEdge[0]=sprintEdge[1]=false;
}

function hasBall(p){return !ball.held&&ball.z<11&&dist(p,ball)<13}
function human(p,dt){
  const i=p.team;
  const gk=P.find(q=>q.team===p.team&&q.role==="K");
  if(p.role==="K"&&state==="setpiece"&&taker===p){
    if(fireEdge[i])release(p);                 // hij neemt de hervatting, niet duiken
    return}
  if(p.role==="K"&&fireEdge[i]&&ball.held!==p&&dist(p,ball)>44&&state==="play"){
    wissel(i);return}                          // niets te redden: pak een veldspeler
  if(p.role==="K"){                            // keeper: lopen binnen de zestien plus de vuurknop
    const kx=(K["r"+i]?1:0)-(K["l"+i]?1:0), ky=(K["d"+i]?1:0)-(K["u"+i]?1:0);
    if(kx||ky){const l=Math.hypot(kx,ky);p.dir=dirOf(kx/l,ky/l);
      const sp=ball.held===p?48:60;
      p.anim+=dt*(sp/8);p.moving=true;
      p.x+=kx/l*sp*dt;p.y+=ky/l*sp*dt*.72;
      const b=boxUit(p.team);
      p.x=Math.max(Math.min(b.gx+2,b.rand),Math.min(Math.max(b.gx+2,b.rand),p.x));
      p.y=Math.max(b.y1,Math.min(b.y2,p.y))}
    if(fireEdge[i]){if(ball.held===p)punt(p);else save(p)}
    if(ball.held===p){                          // hij houdt hem niet eindeloos vast
      p.uit=(p.uit||0)+dt;
      if(p.uit>4)punt(p)}
    return}
  let mx=(K["r"+i]?1:0)-(K["l"+i]?1:0), my=(K["d"+i]?1:0)-(K["u"+i]?1:0);
  /* Exacte knuppelrichting als die er is. Alleen vier schakelaars betekent dat je
     hoek wordt afgerond op achtsten; zo loopt hij precies waar je hem stuurt. */
  if(i===0&&(K.ax||K.ay)){mx=K.ax;my=K.ay}
  const rooted=(state==="setpiece"&&taker===p);
  const sprint=K["s"+i];
  if(mx||my){const l=Math.hypot(mx,my);p.dir=dirOf(mx/l,my/l);
    if(!rooted){
      /* Op gang komen kost tijd, net als afremmen. Meteen op topsnelheid staan
         oogt mechanisch; zo krijgt het lopen gewicht. */
      const top=hasBall(p)?(sprint?60:46):(sprint?84:66);
      p.v=Math.min(top,(p.v||0)+(sprint?150:190)*dt);
      const sp=p.v;
      p.anim+=dt*(sp/8);p.moving=true;p.x+=mx/l*sp*dt;p.y+=my/l*sp*dt*.72}}
  else if(p.v>0&&!rooted){                       // uitlopen na het loslaten
    p.v=Math.max(0,p.v-260*dt);
    if(p.v>4){const d0=D8[p.dir];
      p.x+=d0[0]*p.v*dt;p.y+=inward(p,d0[1]*p.v*dt*.72);
      p.anim+=dt*(p.v/9);p.moving=true;clampP(p)}}
  if(fireEdge[i]){
    /* Een-twee: druk vlak na je eigen pass nog eens en je vraagt de bal terug.
       Je loopt door in de ruimte, je medespeler legt hem voor je neer. */
    if(!hasBall(p)&&eenTweeT>0&&eenTwee===p&&balDoel&&balDoel.team===p.team){
      balDoel.eenTweeNaar=p;balDoel.eenTweeT=2.4;
      eenTweeT=0;eenTwee=null;beep(700,.06,"square",.05)}
    p.fireT=0;p.fireUsed=false;
    if(state==="setpiece"){if(taker&&taker.team===p.team)release(taker);p.fireUsed=true}
    else if(gk&&inOwnBox(p.team)&&dist(gk,ball)<40&&!ball.held){save(gk);p.fireUsed=true}
    else if(ball.held===gk){punt(gk);p.fireUsed=true}
  }
  if(sprintEdge[i]&&state==="play"&&p.cool<=0&&!hasBall(p)){
    let foe=null,fd=1e9;                              // tweede knop zonder bal: tackle
    for(const q of P){if(q.team===p.team||q.role==="K")continue;
      const dd=Math.hypot(q.x-p.x,(q.y-p.y)*1.8);if(dd<fd){fd=dd;foe=q}}
    if(foe&&fd<32){tackle(p,foe);return}}
  if(K["f"+i]){if(p.fireT!=null)p.fireT+=dt}
  else if(p.fireT!=null){
    const hold=p.fireT;p.fireT=null;
    if(p.fireUsed)return;
    const d=dist(p,ball);
    const ruim=inVak(p)?5:0;                          // in het gedrang wat meer speling
    if(d<20+ruim&&ball.z>=40&&ball.z<62&&p.cool<=0&&hold>=.25){
      omhaal(p);return}                               // bal hoog boven je: omhaal
    if(d<19+ruim&&ball.z>21&&ball.z<40&&p.cool<=0){   // bal op kophoogte
      if(hold<.25)head(p); else headShot(p);return}
    if(d<20+ruim&&ball.z>4&&ball.z<=21&&p.cool<=0){volley(p,hold);return}   // bal in de lucht
    if(d<18+ruim&&ball.z<=6&&p.cool<=0){speelBal(p,hold);return}
    wissel(i)}                                        // geen bal in de buurt: wisselen
}
function save(gk){
  if(dist(gk,ball)>40)return;                  // te ver weg: geen zinloze duik                              // keeper: alleen de vuurknop
  gk.dive=.5;
  const d=dist(gk,ball);
  if(d<28&&ball.z<34){gk.hold=1.4;ball.held=gk;ball.last=gk;beep(220,.1,"triangle",.06)}
  else if(d<40){const s=Math.sign(ball.x-ownGoal(gk.team))||1;   // gestompt
    ball.vx=s*110;ball.vy=(ball.y-gk.y)*3;ball.vz=30;ball.touch=.3;
    ball.last=gk;                                 // hij was de laatste aan de bal
    beep(240,.07,"square",.05)}}
function punt(gk){gk.hold=0;ball.held=null;gk.uit=0;
  ball.x=gk.x+attack[gk.team]*8;ball.y=gk.y+2;ball.z=8;
  let mate=null,best=-1;                      // de verst opgestelde medespeler
  for(const q of P){
    if(q.team!==gk.team||q.role==="K")continue;
    const vooruit=(q.x-gk.x)*attack[gk.team];
    if(vooruit>best){best=vooruit;mate=q}}
  if(mate&&best>90)return balNaar(gk,mate.x+(mate.mvx||0)*.5,mate.y+(mate.mvy||0)*.5,vzVoor(30),190);
  gk.dir=attack[gk.team]>0?0:4;kick(gk,.8,true)}
function keeper(p,dt,kpSpd){
  const gx=ownGoal(p.team)+(attack[p.team]>0?7:-7);
  p.x+=(gx-p.x)*4*dt;
  if(p.hold>0){p.hold-=dt;
    ball.held=p;ball.x=p.x+attack[p.team]*7;ball.y=p.y+3;ball.z=10;
    ball.vx=ball.vy=ball.vz=0;
    if(p.hold<=0){ball.held=null;p.dir=attack[p.team]>0?0:4;kick(p,1,true)}
    return}
  const inBox=Math.abs(ball.x-ownGoal(p.team))<170;
  const balSnel=Math.hypot(ball.vx,ball.vy)>115;   // pas bij een geschoten of gespeelde bal
  /* Hij schat waar de bal de lijn kruist en gaat daarheen, maar hij leest niet
     perfect en hij is niet oneindig snel. Plaatsing in de hoek loont daardoor. */
  /* Zodra er geschoten wordt kiest hij eenmalig een hoek en gaat daarheen. Hij mag
     die keuze niet meer bijstellen, precies zoals een echte keeper moet gokken.
     Zijn kracht zit in hoe goed hij leest, niet in alles alsnog halen. */
  const balSp=Math.hypot(ball.vx,ball.vy);
  /* Bij een strafschop kiest hij vooraf een hoek en gaat daarheen, zonder de baan
     te lezen. Anders is er geen doorkomen aan: dan pakt hij er 23 van de 24. */
  if(state==="setpiece"&&setType==="penalty"){
    if(p.penGok===undefined)
      p.penGok=midY+(Math.random()<.5?-1:1)*(10+Math.random()*((W.gy2-W.gy1)/2-6));
  }else if(p.penGok!==undefined&&balSp<40)p.penGok=undefined;
  if(p.penGok!==undefined){
    const dy=p.penGok-p.y;
    if(Math.abs(dy)>2){p.y+=Math.sign(dy)*Math.min(Math.abs(dy),(26+level*2)*dt);
      p.moving=true;p.anim+=dt*6;p.walkT=.18}
    p.x=ownGoal(p.team)+(ownGoal(p.team)<midX?6:-6);
    clampP(p);return}
  if(balSp>120){
    if(p.gok===undefined){
      const gx=ownGoal(p.team), t=Math.abs(gx-ball.x)/Math.max(60,Math.abs(ball.vx));
      const komt=ball.y+ball.vy*Math.min(t,1.2);
      p.gok=komt+(Math.random()-.5)*(22-level*1.4);   // hoe hoger het niveau, hoe beter de gok
    }
  }else p.gok=undefined;
  p.aimT=(p.aimT||0)-dt;
  if(p.aimT<=0){p.aimT=.4;p.aimY=ball.y+(Math.random()-.5)*(20-level*1.2)}
  /* Zolang een aanvaller de bal aan de voet houdt dekt de keeper alleen de hoek af.
     Hij spiegelt je dribbel dus niet meer; pas als de bal onderweg is duikt hij mee. */
  let ty;
  if(!inBox)ty=midY;
  else if(balSnel)ty=(p.gok!==undefined?p.gok:(p.aimY!==undefined?p.aimY:ball.y));
  else ty=midY+(ball.y-midY)*.35;
  ty=Math.max(W.gy1+4,Math.min(W.gy2-4,ty));
  const dy=ty-p.y;
  const tempo=(12+level*0.9)*(balSnel?1:.42);    // niet oneindig snel: hoeken zijn te halen
  if(Math.abs(dy)>4){p.moving=true;p.anim+=dt*5;
    p.y+=Math.sign(dy)*Math.min(Math.abs(dy),tempo*dt)}
  p.dir=attack[p.team]>0?0:4;
  const mine=humans().includes(p.team);
  if(state==="play"&&inBox&&Math.abs(ball.x-p.x)<16&&Math.abs(ball.y-p.y)<(5+level*.3)&&ball.z<30&&p.cool<=0&&!ball.held){
    const s=Math.sign(ball.x-ownGoal(p.team))||1;
    p.cool=.7;                                   // niet elke frame opnieuw
    ball.last=p;                                 // elke keeperaanraking telt mee
    if(mine){                                    // jouw keeper blokt met het lichaam
      ball.vx=s*120;ball.vy=(ball.y-p.y)*3+(Math.random()-.5)*70;ball.vz=22;ball.touch=.35;
      beep(240,.06,"square",.05)}
    else{p.dive=.5;
      if(Math.random()*12<level+2){p.hold=1.1;ball.held=p;beep(200,.1,"triangle",.05)}
      else{ball.vx=s*130;ball.vy=(ball.y-p.y)*3+(Math.random()-.5)*80;ball.vz=28;ball.touch=.35;
        beep(240,.07,"square",.05)}}}
}
function formatiePlek(p){          // basispositie, met de vleugels aan de zijlijn
  const rem=aftrapVrij>0?.12:1;    // vlak na de aftrap komt de ploeg rustig op gang
  /* De ploeg schuift mee met de bal, maar niet iedereen even ver: verdedigers
     blijven achter, spitsen lopen door. Zonder dat verschil komt de hele ploeg
     mee naar voren, klit alles rond één doel en wordt de helft van het veld
     nooit gebruikt. */
  const rol=p.role==="D"?.28:p.role==="M"?.5:.72;
  const push=Math.max(-170,Math.min(210,(ball.x-midX)*(.34+rol*.5)*attack[p.team]))*rem;
  let tx=homeX(p)+attack[p.team]*push;
  /* Verdedigers komen nooit ver over de middenlijn, spitsen zakken nooit ver terug.
     Zo houdt de ploeg diepte en ontstaat er ruimte om in te spelen. */
  const eigenD=ownGoal(p.team);
  const diep=(tx-eigenD)*(midX>eigenD?1:-1);
  const veld=Math.abs(W.gx1-W.gx0);
  const minDiep=p.role==="D"?0:p.role==="M"?veld*.18:veld*.34;
  const maxDiep=p.role==="D"?veld*.62:p.role==="M"?veld*.82:veld;
  const kl=Math.max(minDiep,Math.min(maxDiep,diep));
  tx=eigenD+(midX>eigenD?1:-1)*kl;
  let ty=homeY(p)+(ball.y-midY)*.12;
  const buiten=p.fy<.35||p.fy>.65;
  const aanvallend=(ball.x-midX)*attack[p.team]>-60;
  if(buiten&&aanvallend)ty=p.fy<.5?W.top+10:W.bot-10;
  return [tx,ty]}

/* Vrijlopen: rond de eigen formatieplek worden een paar plekken afgewogen.
   Ruimte telt, vooruit staan telt, en een speellijn die door een tegenstander
   wordt afgesneden kost punten. De keuze blijft ruim een halve seconde staan,
   anders gaat iedereen staan trillen. */
const LOOPPLEKKEN=[[0,0],[55,0],[95,0],[45,-26],[45,26],[0,-32],[0,32],[-40,0],[80,-22],[80,22]];
function vrijloop(p,dt){
  p.loopT=(p.loopT||0)-dt;
  if(p.loopT>0&&p.loopX!==undefined)return [p.loopX,p.loopY];
  p.loopT=.55+Math.random()*.35;
  const basis=formatiePlek(p);
  let best=null,bs=-1e9;
  for(const [ox,oy] of LOOPPLEKKEN){
    const cx=basis[0]+ox*attack[p.team], cy=basis[1]+oy;
    if(cx<W.gx0+25||cx>W.gx1-25||cy<W.top+6||cy>W.bot-6)continue;
    let ruimte=1e9;
    for(const o of P){if(o.team===p.team||o.role==="K")continue;
      ruimte=Math.min(ruimte,Math.hypot(o.x-cx,(o.y-cy)*3))}
    const vooruit=Math.max(0,Math.min(150,(cx-ball.x)*attack[p.team]));
    const dx=cx-ball.x, dy=cy-ball.y, l=Math.hypot(dx,dy)||1;
    let dicht=0;
    for(const o of P){if(o.team===p.team||o.role==="K")continue;
      const s=((o.x-ball.x)*dx+(o.y-ball.y)*dy)/(l*l);
      if(s<=.1||s>=1)continue;
      if(Math.hypot(o.x-(ball.x+dx*s),(o.y-(ball.y+dy*s))*3)<26)dicht++}
    let maat=1e9;                                  // niet op de lip van een ploeggenoot gaan staan
    for(const q of P){if(q.team!==p.team||q===p||q.role==="K")continue;
      maat=Math.min(maat,Math.hypot(q.x-cx,(q.y-cy)*3))}
    const loop=Math.hypot(p.x-cx,(p.y-cy)*3);
    const punt=Math.min(ruimte,170)+vooruit*.4-dicht*55-loop*.2+Math.min(maat,90)*.55;
    if(punt>bs){bs=punt;best=[cx,cy]}}
  p.loopX=best?best[0]:basis[0];p.loopY=best?best[1]:basis[1];
  return [p.loopX,p.loopY]}

function ai(p,dt,spd,spread){
  const chaser=(p===nearest(p.team)), bd=dist(p,ball);
  let tx,ty;
  if(ball.held&&ball.held.role==="K"&&ball.held.team!==p.team){
    tx=homeX(p);ty=homeY(p)}                       // keeper heeft hem vast: terug naar je plek
  else if(balDoel===p&&balDoelT>0&&!ball.held){
    /* Jij bent aangespeeld: loop naar waar de bal aankomt in plaats van naar
       waar hij nu ligt. Zo komt een pass veel vaker aan. */
    const vt=Math.min(.9,Math.hypot(ball.vx,ball.vy)/260);
    tx=ball.x+ball.vx*vt;ty=ball.y+ball.vy*vt;
    spd*=1.12}
  else if(p.haalT>0){                       // losse bal: ga hem halen
    p.haalT-=dt;
    const vt=Math.min(.7,Math.hypot(ball.vx,ball.vy)/300);
    tx=ball.x+ball.vx*vt;ty=ball.y+ball.vy*vt;spd*=1.1}
  else if(chaser){tx=ball.x;ty=ball.y;
    /* Staat er een tegenstander aan de bal en ben jij erbij, dan probeert hij hem
       af te pakken. Lukt dat niet netjes, dan is het een overtreding. */
    const houder=ball.last;
    if(state==="play"&&houder&&houder.team!==p.team&&houder.role!=="K"&&
       !ball.held&&p.cool<=0&&dist(p,houder)<27&&dist(p,ball)<32){
      /* Eerst afstoppen, dan pas een poging. Hoe langer hij naast je loopt,
         hoe groter zijn kans. Zo kost een duel tijd in plaats van een muntworp. */
      p.drukT=Math.min(2,(p.drukT||0)+dt);
      if(ball.rust<=0&&p.drukT>.45&&pogingT[p.team]<=0){
        pogingT[p.team]=1;                        // de hele ploeg wacht daarna even
        const kans=Math.min(.6,(.09+level*.03)*(1+(p.drukT-.45)));
        /* De computer probeert de bal te veroveren zonder sliding. Lukt het, dan
           tikt hij hem weg; lukt het niet, dan gebeurt er niets. Alleen als hij
           er echt bovenop zit wordt het een tackle die gefloten kan worden. */
        if(Math.random()<kans){
          const dichtbij=Math.hypot(p.x-ball.x,(p.y-ball.y)*2)<26&&ball.z<12;
          if(dichtbij&&Math.random()<.93){
            const d=D8[p.dir];
            ball.vx=d[0]*130;ball.vy=inward(p,d[1]*130);ball.vz=0;
            ball.last=p;ball.touch=.3;houder.cool=.4;
            beep(300,.06,"square",.05);
          }else tackle(p,houder);
        }else p.drukT=.15}}
    else p.drukT=Math.max(0,(p.drukT||0)-dt*1.5);}   // druk zakt weg, maar niet meteen
  else if(state==="play"&&aftrapVrij<=0&&ball.last&&ball.last.team===p.team&&!ball.held){
    const v=vrijloop(p,dt);tx=v[0];ty=v[1];       // eigen ploeg aan de bal: vrijlopen
  }else{const f=formatiePlek(p);tx=f[0];ty=f[1]}
  if(state==="setpiece"&&teDichtbij(p)){        // uit de buurt blijven bij een hervatting
    tx=p.x+(p.x-ball.x);ty=p.y+(p.y-ball.y)*.3}
  const dx=tx-p.x,dy=ty-p.y,l=Math.hypot(dx,dy);
  const sp=hasBall(p)?spd*.72:spd;             // met bal aan de voet trager
  if(l>7){p.x+=dx/l*sp*dt;p.y+=dy/l*sp*.72*dt;
    turn(p,dx,dy,dt);p.anim+=dt*(sp/8);p.moving=true}
}

function ballPhysics(dt){
  if(ball.held)return;
  if(state==="setpiece"&&taker){
    if(setType==="throwin"){ball.x=taker.x;ball.y=taker.y-1;ball.z=36}
    ball.vx=ball.vy=ball.vz=0;return}
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  ball.z+=ball.vz*dt;ball.vz-=210*dt;
  if(ball.z<=0){ball.z=0;
    if(ball.vz<-6){ball.vz*=-.82;beep(180,.04,"triangle",.03)}else ball.vz=0;
    const sp=Math.hypot(ball.vx,ball.vy);
    const f=Math.pow(sp>110?.62:.13,dt);ball.vx*=f;ball.vy*=f}
  else{const f=Math.pow(.94,dt);ball.vx*=f;ball.vy*=f}
  // netten: een bal die erin gaat blijft erin liggen
  for(const side of [0,1]){
    const gx=side===0?W.gx0:W.gx1, d=side===0?-1:1, back=gx+d*17;
    if(side===0?ball.x>gx:ball.x<gx)continue;
    if(ball.y<W.gy1-3||ball.y>W.gy2+3)break;
    if(side===0?ball.x<back:ball.x>back){ball.x=back;ball.vx*=-.2}
    if(ball.y<W.gy1){ball.y=W.gy1;ball.vy*=-.3}
    if(ball.y>W.gy2){ball.y=W.gy2;ball.vy*=-.3}
    const nf=Math.pow(.03,dt);ball.vx*=nf;ball.vy*=nf;
    if(ball.z>40){ball.z=40;ball.vz=Math.min(0,ball.vz)}}
  ball.touch-=dt}

function contacts(dt){
  if(ball.held||ball.touch>0)return;
  let p=null,bd=1e9;
  /* Balbezit is kleverig: wie hem heeft, houdt hem, tenzij een tegenstander
     duidelijk dichter bij de bal staat. Zonder die drempel wordt een stilliggende
     bal elke frame opnieuw geclaimd en flippert het balbezit heen en weer. */
  const houder=ball.last;
  const dHouder=houder?Math.hypot(houder.x-ball.x,(houder.y-ball.y)*2.4):1e9;
  const vers=(q)=>{
    if(ball.rust>0&&houder&&q.team!==houder.team)return false;
    if(ball.verbodT>0&&q===ball.verbod)return false;
    if(houder&&q.team!==houder.team&&dHouder<26){
      const d=Math.hypot(q.x-ball.x,(q.y-ball.y)*2.4);
      if(d>dHouder-9)return false;             // niet zomaar afpakken
    }
    return true};
  if(balDoel&&balDoelT>0&&!ball.held&&ball.z<12){   // geldt voor beide ploegen
    /* Aanname: de bal wordt afgeremd én naar de voet getrokken, zodat je meteen
       verder kunt in plaats van er eerst naartoe te moeten lopen. */
    const d=Math.hypot(balDoel.x-ball.x,(balDoel.y-ball.y)*2);
    /* De kleefhulp geldt alleen als de bal nog van zijn eigen ploeg is. Anders
       plukt een aangespeelde speler hem terug nadat de tegenpartij hem veroverde,
       en dan kaatst de bal eindeloos heen en weer tussen twee spelers. */
    if(d<34&&balDoel.cool<=0&&
       (!ball.last||ball.last.team===balDoel.team)&&
       !(ball.rust>0&&houder&&houder.team!==balDoel.team)){
      const dd=D8[balDoel.dir];
      ball.x=balDoel.x+dd[0]*9;ball.y=balDoel.y+dd[1]*6+2;ball.z=0;
      ball.vx*=.14;ball.vy*=.14;ball.vz=0;
      ball.last=balDoel;ball.touch=.05;
      balDoel.passT=Math.max(balDoel.passT||0,.9);   // even zelf doorlopen
      balDoel=null}}
  for(const t of humans()){                       // jouw speler heeft voorrang
    const q=ctrl[t];if(!q||q.cool>0||!vers(q))continue;
    const d=Math.hypot(q.x-ball.x,q.y-ball.y);
    if(d<23&&d<bd){bd=d;p=q}}
  if(!p){for(const q of P){if(q.cool>0||!vers(q))continue;
    const d=Math.hypot(q.x-ball.x,q.y-ball.y);if(d<bd){bd=d;p=q}}}
  if(!p)return;
  const jij=p===ctrl[p.team]&&humans().includes(p.team);
  if(bd<15&&ball.z>21&&ball.z<38&&p.role!=="K"&&!jij){
    /* De computer speelt de bal weg of neemt hem aan; hij houdt hem niet hoog.
       Een zachte kopbal komt namelijk weer op kophoogte terug, en dan blijft hij
       eindeloos jongleren. */
    p.dir=dirOf(foeGoal(p.team)-p.x,midY-p.y);
    const naarDoel=Math.abs(foeGoal(p.team)-p.x)<300;
    if(naarDoel){headShot(p);return}
    const keuze=medespeler(p,260);
    if(keuze&&Math.random()<.6){
      const m=keuze.q;
      balDoel=m;balDoelT=1.8;
      balNaar(p,m.x+(m.mvx||0)*.4,m.y+(m.mvy||0)*.4,vzVoor(12),130);
      p.cool=.3;beep(520,.08,"square",.06);return}
    ball.z=Math.min(ball.z,6);ball.vz=0;          // aannemen: bal komt naar beneden
    ball.vx*=.2;ball.vy*=.2;ball.last=p;ball.touch=.1;p.cool=.2;return}
  if(p.role==="K"){                             // bal stuit alleen op zijn lichaam
    if(Math.abs(ball.x-p.x)<11&&Math.abs(ball.y-p.y)<7&&ball.z<30){
      const s=Math.sign(ball.x-ownGoal(p.team))||1;
      ball.vx=s*Math.max(80,Math.abs(ball.vx));
      ball.vy=(ball.y-p.y)*4;ball.vz=26;ball.touch=.3;
      beep(240,.06,"square",.05)}
    return}
  if(bd>14||ball.z>13)return;
  const bs=Math.hypot(ball.vx,ball.vy);
  if(p===ctrl[p.team]&&humans().includes(p.team)){
    if(p.fireT!=null&&ball.z>4)return;          // knop ingedrukt: je laadt een volley of kopbal
    if(bs>110||ball.z>4){                       // aanname: bal dood en meteen naar de voet
      ball.vx*=.10;ball.vy*=.10;ball.vz*=.12;ball.z=Math.min(ball.z,3);
      const d0=D8[p.dir], tx=p.x+d0[0]*9, ty=p.y+d0[1]*6+2;
      const k0=Math.min(1,7*dt);
      ball.x+=(tx-ball.x)*k0;ball.y+=(ty-ball.y)*k0;   // trekt hem om je heen naar voren
      ball.touch=.06;return}
    dribble(p,dt);return}
  if(bs>150&&Math.abs(foeGoal(p.team)-p.x)>200){ // computer neemt ook eerst aan
    ball.vx*=.16;ball.vy*=.16;ball.vz*=.15;ball.z=Math.min(ball.z,4);ball.touch=.16;
    ball.last=p;return}
  // computerspeler beslist bij aanraking
  const gx=foeGoal(p.team), far=Math.abs(gx-p.x);
  const wide=Math.abs(p.y-midY)>26;
  if(far<190&&!wide){                            // schot precies gericht, niet in acht stappen
    const my=midY+(Math.random()-.5)*spreadFor()*.5;
    const dx=gx-p.x, dy=my-p.y, l=Math.hypot(dx,dy)||1;
    p.dir=dirOf(dx,dy);
    ball.vx=dx/l*230;ball.vy=inward(p,dy/l*230);ball.vz=0;
    ball.last=p;ball.touch=.25;p.cool=.3;beep(400,.1,"square",.07);return}
  if(far<300&&wide&&Math.random()<.5){          // voorzet de zestien in
    p.dir=dirOf(gx-p.x,midY-p.y);kick(p,.9,true);return}
  /* De computer speelt met dezelfde gerichte pass als jij, inclusief de kleefhulp
     bij de ontvanger. Met een blinde trap in acht richtingen kwam zijn bal zelden
     aan en werd er voortdurend om een stilliggende bal gevochten. */
  let mate=null,mbs=1e9;
  for(const q of P){
    if(q.team!==p.team||q===p||q.role==="K")continue;
    const dx=q.x-p.x, dy=q.y-p.y;
    const af=Math.hypot(dx,dy*3.2);
    if(af<75||af>320)continue;        // op een paar meter loop je zelf door
    const vooruit=dx*attack[p.team];
    const lijn=speellijn(p,q);
    const punt=af*(vooruit>0?.7:1.6)*(1+lijn.dekking*1.1);
    if(punt<mbs){mbs=punt;mate=q}}
  /* Niet meteen weer afspelen: een speler die de bal net kreeg houdt hem eerst
     even, anders tikken twee spelers hem eindeloos heen en weer. */
  /* Terugleggen bij een een-twee: vóór de loper uit, zodat hij erop kan inlopen. */
  p.eenTweeT=Math.max(0,(p.eenTweeT||0)-dt);
  if(p.eenTweeNaar&&p.eenTweeT>0&&hasBall(p)){
    const m2=p.eenTweeNaar;
    const tx2=m2.x+attack[p.team]*36, ty2=m2.y+(m2.mvy||0)*.3;
    balDoel=m2;balDoelT=1.8;
    balNaar(p,tx2,ty2,vzVoor(0),120);
    p.eenTweeNaar=null;p.eenTweeT=0;p.passT=1;
    return}
  p.passT=(p.passT||0)-dt;
  if(mate&&p.passT<=0&&Math.random()<.35+level*.05){
    p.passT=1.2;
    const afst=Math.hypot(mate.x-p.x,(mate.y-p.y)*3.2);
    const lijn=speellijn(p,mate);
    const top=lijn.dekking>0?Math.max(18,afst*.12):(afst>300?11:0);
    balDoel=mate;balDoelT=1.8;
    balNaar(p,mate.x+(mate.mvx||0)*.4,mate.y+(mate.mvy||0)*.4,vzVoor(top),100);
    return}
  p.dir=dirOf(attack[p.team],(midY-p.y)*.02);
  dribble(p,dt)}
const spreadFor=()=>48-level*4.4;

function outOfPlay(){
  if(ball.held)return;
  if(ball.y<W.top-2||ball.y>W.bot+2){
    const team=ball.last?1-ball.last.team:0;
    setPiece("throwin",team,Math.max(50,Math.min(W.w-50,ball.x)),ball.y<midY?W.top-2:W.bot+2);return}
  for(const side of [0,1]){
    const gx=side===0?W.gx0:W.gx1;
    if(side===0?ball.x>gx:ball.x<gx)continue;
    /* Paal en lat: binnen twee eenheden van een paal of net onder de lat ketst de
       bal terug het veld in, met wat snelheidsverlies. */
    const bijPaal=Math.min(Math.abs(ball.y-W.gy1),Math.abs(ball.y-W.gy2))<2.6&&ball.z<46;
    /* Lat: alleen als de bal er van onderaf tegenaan komt. Gaat hij er ruim
       overheen, dan is het gewoon een doeltrap. */
    const bijLat=ball.z>39&&ball.z<47&&ball.vz<10&&
                 ball.y>W.gy1+2&&ball.y<W.gy2-2;
    if((bijPaal||bijLat)&&ball.y>W.gy1-3&&ball.y<W.gy2+3){
      ball.x=gx+(side===0?3:-3);
      ball.vx*=-.62;
      if(bijPaal)ball.vy=(ball.y<midY?-1:1)*Math.max(40,Math.abs(ball.vy))*.8;
      if(bijLat){ball.vz=-Math.abs(ball.vz)*.5;ball.z=38}
      ball.touch=.3;beep(150,.09,"square",.07);
      return}
    if(ball.y>W.gy1&&ball.y<W.gy2&&ball.z<42){goal(ownGoal(0)===gx?1:0);return}
    const def=(ownGoal(0)===gx)?0:1;
    if(ball.last&&ball.last.team===def){stat.corners[1-def]++;
      setPiece("corner",1-def,gx,ball.y<midY?W.top+4:W.bot-4)}
    else setPiece("goalkick",def,gx+(side===0?55:-55),midY+(ball.y<midY?-14:14));
    return}}

/* ===== tekenen ===== */
const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w,h)};
function line(x1,y1,x2,y2,c){
  x1|=0;y1|=0;x2|=0;y2|=0;
  const dx=Math.abs(x2-x1),sx=x1<x2?1:-1,dy=-Math.abs(y2-y1),sy=y1<y2?1:-1;
  let err=dx+dy;ctx.fillStyle=c;
  for(let n=0;n<1600;n++){
    if(x1>=0&&x1<320&&y1>=0&&y1<200)ctx.fillRect(x1,y1,1,1);
    if(x1===x2&&y1===y2)break;
    const e2=2*err;
    if(e2>=dy){err+=dy;x1+=sx}
    if(e2<=dx){err+=dx;y1+=sy}}}
const wline=(x1,y1,h1,x2,y2,h2,c)=>line(SX(x1,y1),y1-h1,SX(x2,y2),y2-h2,c);
const snap=v=>Math.round(v/2)*2;

function crowd(){
  px(0,0,320,23,"#202020");
  const off=(cam*.3)%6;
  for(let row=0;row<4;row++){const y=row*6;
    for(let i=-1;i<56;i++){const x=Math.round(i*6-off);
      const k=Math.abs((i*5+row*3+((cam*.3/6)|0))%4);
      const col=[C.wht,"#D82820",C.grey,"#F0A0A0"][k];
      px(x+1,y,4,3,col);px(x,y+3,5,4,col===C.blk?C.dgrey:C.blk)}}
  px(0,24,320,8,C.blk);
  const bo=(cam*.7)%144;
  for(let i=-1;i<7;i++){const x=Math.round(i*144-bo);
    const j=((i%4)+4)%4;
    const col=["#4830B0","#D82820","#C8C020","#186818"][j];
    px(x,23,142,10,col);
    ctx.font="9px monospace";ctx.textAlign="center";ctx.textBaseline="top";
    ctx.fillStyle=j===2?C.blk:C.wht;
    ctx.fillText(["NISSAN","UTREG 84","ADMIRAL","GALGENWAARD"][j],x+71,24)}
  px(0,33,320,1,"#004000")}

function pitch(){
  px(0,34,320,166,C.grass);
  /* Gemaaide banen: stroken van tien meter die met het veld meeschuiven, plus
     kaalgespeelde plekken voor de doelen. Egaal groen oogt plat. */
  const donker="#2E9440";
  for(let wx=W.gx0;wx<W.gx1;wx+=100){
    const a=SX(wx,W.top), b2=SX(wx+50,W.top);
    const c=SX(wx,W.bot), d2=SX(wx+50,W.bot);
    for(let y=W.top;y<=W.bot;y++){
      const t=(y-W.top)/(W.bot-W.top);
      const x1=Math.round(a+(c-a)*t), x2=Math.round(b2+(d2-b2)*t);
      if(x2<0||x1>320)continue;
      px(Math.max(0,x1),y,Math.min(320,x2)-Math.max(0,x1),1,donker)}}
  const kaal="#84B058";
  for(const gx of [W.gx0,W.gx1]){
    const d=gx===W.gx0?1:-1;
    for(let y=W.gy1-6;y<=W.gy2+6;y++){
      const x1=SX(gx+d*4,y), x2=SX(gx+d*30,y);
      const a2=Math.min(x1,x2), b3=Math.max(x1,x2);
      if(b3<0||a2>320)continue;
      px(Math.max(0,a2),y,Math.min(320,b3)-Math.max(0,a2),1,kaal)}}
  const L=C.wht;
  line(SX(W.gx0,W.top),W.top,SX(W.gx1,W.top),W.top,L);
  line(SX(W.gx0,W.bot),W.bot,SX(W.gx1,W.bot),W.bot,L);
  for(const wx of [W.gx0,W.gx1,midX])wline(wx,W.top,0,wx,W.bot,0,L);
  ctx.fillStyle=L;                              // middencirkel: nette ovaal
  for(let a=0;a<Math.PI*2;a+=.004){
    const wy=midY+Math.sin(a)*27, sx=SX(midX+Math.cos(a)*91,wy);
    if(sx>=0&&sx<320)ctx.fillRect(sx,Math.round(wy),1,1)}
  px(SX(midX,midY)-1,midY-1,2,2,L);
  for(const gx of [W.gx0,W.gx1]){const d=gx===W.gx0?1:-1;
    for(const [dep,sp] of [[165,42],[55,19]]){

function limb(x0,y0,x1,y1,col,w){
  const n=Math.max(1,Math.round(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))));
  for(let i=0;i<=n;i++)
    px(snap(x0+(x1-x0)*i/n)-(w>>1)+1,Math.round(y0+(y1-y0)*i/n),w,2,col)}

function drawPlayer(p){
  const X=snap(SX(p.x,p.y)), gy=Math.round(p.y), y=gy-Math.round(p.z);
  if(X<-26||X>346)return;
  const gk=p.role==="K";
  const kit=p.ref?SCHEIDS:(gk?KEEP[p.team]:KIT[p.team]);
  const mine=!p.ref&&humans().includes(p.team)&&p===ctrl[p.team];
  const shirt=mine?kit.light:kit.shirt;
  /* Driehoekje boven de speler die je bestuurt, zoals in moderne voetbalspellen.
     Zonder zo'n merkteken weet je in het gedrang niet wie je stuurt. */
  if(mine&&state!=="menu"){
    const top=y-42;
    px(X-4,top,9,1,C.wht);px(X-3,top+1,7,1,C.wht);
    px(X-2,top+2,5,1,C.wht);px(X-1,top+3,3,1,C.wht);px(X,top+4,1,1,C.wht)}
  /* En een ringetje onder de speler die je aanspeelt, zodat je ziet waar de bal
     heen gaat voordat hij er is. */
  if(balDoel===p&&balDoelT>0&&humans().includes(p.team)){
    px(X-5,gy+1,11,1,C.yel);px(X-6,gy,1,1,C.yel);px(X+5,gy,1,1,C.yel)}
  const d=p.dir, front=(d>=1&&d<=3), back=(d>=5&&d<=7);
  const sideV=(d!==2&&d!==6), face=(d>=3&&d<=5)?-1:1;
  px(X-5,gy,11,2,"rgba(0,0,0,.25)");
  if(p.dive){                                   // liggende duik, op dezelfde maat als staand
    const dy=y-7, f=face;
    const R=(x0,yy,w,hh,c)=>px(f>0?X+x0:X-x0-w,yy,w,hh,c);
    R(-10,dy-3,16,7,shirt);                     // romp
    R(-15,dy-1,6,6,kit.shorts);                 // broek
    R(-4,dy-4,4,2,kit.kraag||C.wht);            // kraagje
    R(6,dy-7,7,7,C.skin);                       // hoofd
    R(6,dy-8,7,3,C.blk);                        // haar
    R(f>0?11:11,dy-4,2,2,C.blk);                // oog
    R(5,dy-2,6,3,C.skin);R(11,dy-3,5,4,gk?C.yel:C.skin);   // gestrekte arm
    R(-20,dy+1,6,3,C.skin);R(-17,dy+1,4,3,kit.sock);       // been en kous
    R(-25,dy+2,5,2,C.blk);                      // schoen
    return}
  const air=false;
  const STEP=Math.PI/6;
  const walk=p.walkT>0&&!air;
  const ph=walk?Math.floor(p.anim/STEP)*STEP:0;
  const s=Math.sin(ph), co=Math.cos(ph);
  const ty=y+(walk&&Math.abs(co)>.85?-1:0);
  const hipY=ty-12, shY=ty-23;
  const AL=air?2:(sideV?7:3.2);                  // pas iets korter bij de kleinere speler
  const AA=(sideV?5.5:2.4)*(sideV?face:1);       // armen zwaaien bijna even ver mee
  const leg=(base,a,skin)=>{
    const sw=Math.sin(a);
    const back=air?.4:Math.max(0,-sw);           // achterste been buigt scherp, hiel komt hoog
    const lift=back*3.4;
    const kx=base+sw*AL*.45+back*1.6, ky=ty-6-back*1.6;
    const fx=base+sw*AL-back*2.4,   fy=ty-2-lift;
    limb(base,hipY,kx,ky,skin,6);                // bovenbeen
    limb(kx,ky,fx,fy,skin,4);                    // onderbeen, wijst naar achteren omhoog
    limb(kx+(fx-kx)*.4,ky+(fy-ky)*.4,fx,fy,kit.sock,4);
    limb(kx+(fx-kx)*.58,ky+(fy-ky)*.58,kx+(fx-kx)*.74,ky+(fy-ky)*.74,kit.sock2,4);
    px(snap(fx)-2,Math.round(fy)-1,5,2,C.blk)};
  const armsUp=air||p.cel||(state==="setpiece"&&setType==="throwin"&&taker===p);
  const arm=(base,a,skin)=>{
    if(armsUp){limb(base,shY+4,base+(base<X?-3:3),shY-8,skin,3);return}
    const sw=Math.sin(a), bend=Math.max(0,-Math.cos(a))*1.8;   // elleboog buigt naar voren
    const ey=shY+7-bend, hy=shY+12-bend*1.4;                   // hand net onder de heup
    const ex=base+sw*AA*.45+bend*.6, hx=base+sw*AA+bend*1.1;
    limb(base,shY+4,ex,ey,skin,3);                             // dunner dan de benen
    limb(ex,ey,hx,hy,skin,3);
    if(gk)px(snap(hx)-2,Math.round(hy)-1,6,4,C.yel)};
  // silhouet verschilt per richting: smal van opzij, breed van voren en achteren
  const schuin=(d===1||d===3||d===5||d===7);
  const bw=sideV?(schuin?7:6):9;                  // rompbreedte
  const bx=X-(bw>>1)+(sideV?face*1:0);            // van opzij iets in de kijkrichting
  const hx=X-3+(sideV?face*2:0)+(schuin?face:0);  // hoofd draait mee
  const lb=sideV?(schuin?[X-1,X+1]:[X,X]):[X-2,X+2];
  const aw=sideV?(schuin?5:4):6;
  const armNaar=X+face*aw, armVan=X-face*aw;      // arm aan de kijkzijde is de zichtbare
  leg(lb[0],ph+Math.PI,"#C87850");
  if(!sideV||schuin)arm(armVan,ph,C.skin);        // van opzij valt de verre arm weg
  leg(lb[1],ph,C.skin);
  px(bx,ty-24,bw,10,shirt);                                     // romp
  const kr=kit.kraag||C.wht;
  px(bx,ty-24,bw,1,kr);                                         // kraag over de schouders
  if(front||back)px(X-1,ty-25,3,1,kr);                          // halsboordje
  px(bx,ty-15,bw,4,kit.shorts);                                 // broek
  if(gk)px(bx,ty-24,bw,2,C.yel);
  const sl=mine?kit.light:kit.sleeve;
  if(sideV){const mx=X+face*((bw>>1)-1)-1;px(mx,ty-24,2,6,sl);px(mx,ty-24,2,1,kr)}
  else{px(bx-2,ty-24,2,6,sl);px(bx+bw,ty-24,2,6,sl);
       px(bx-2,ty-24,2,1,kr);px(bx+bw,ty-24,2,1,kr)}          // biesje op de mouwen
  if(!gk&&front)px(X-2,ty-21,5,2,kit.badge);                     // sponsor alleen op de borst
  px(X-1+(sideV?face:0),ty-26,3,3,C.skin);                      // nek
  px(hx,ty-33,7,7,C.skin);                                      // hoofd
  px(hx,ty-34,7,3,C.blk);
  if(back){px(hx,ty-33,7,5,C.blk)}
  else if(front){px(hx+1,ty-30,1,2,C.blk);px(hx+5,ty-30,1,2,C.blk)}
  else{px(hx+(face>0?4:2),ty-30,1,2,C.blk);
       px(hx+(face>0?0:6),ty-32,1,5,C.blk);
       px(hx+(face>0?7:-1),ty-30,1,2,C.skin)}
  arm(armNaar,ph+Math.PI,C.skin);
}

  px(ax-4,ay-30,9,7,C.blk);
  px(ax-3,ay-25,7,6,C.skin);
  px(ax-4,ay-24,2,5,C.blk);px(ax+3,ay-24,2,5,C.blk);
  px(ax-4,ay-19,9,9,"#68C0D8");
  px(ax-6,ay-10,13,12,"#68C0D8");
  px(ax-4,ay-13,9,2,C.wht);
  px(ax-6,ay-18,2,7,C.skin);px(ax+5,ay-18,2,7,C.skin);
  px(ax-3,ay+2,3,3,C.blk);px(ax+2,ay+2,3,3,C.blk)}
function penMik(){                 // bewegend mikpunt bij een strafschop
  if(state!=="setpiece"||setType!=="penalty"||!taker)return;
  if(!humans().includes(taker.team))return;
  const gx=foeGoal(taker.team);
  const y=midY+Math.sin(penT*2.6)*((W.gy2-W.gy1)/2-2);
  const sx=SX(gx,y), sy=Math.round(y);
  const c=Math.floor(penT*8)%2===0?C.yel:C.wht;
  px(sx-4,sy-24,9,2,c);px(sx-4,sy-9,9,2,c);
  px(sx-1,sy-22,3,3,c);px(sx-1,sy-12,3,3,c);
  px(sx-1,sy-17,3,4,c)}
function radar(){
  /* Minikaart linksonder: het hele veld in het klein, met alle spelers en de bal.
     Je ziet maar een deel van het veld, dus zonder dit weet je niet waar je
     medespelers staan. */
  if(state!=="play"&&state!=="kickoff"&&state!=="setpiece")return;
  const rw=61, rh=24, rx=(320-rw)>>1, ry=34;   // midden boven, twintig procent kleiner
  px(rx-2,ry-2,rw+4,rh+4,"#101810");            // donker kader, anders valt hij weg
  px(rx-1,ry-1,rw+2,rh+2,"#5A6A5A");
  px(rx,ry,rw,rh,"#0C2A0C");
  px(rx+(rw>>1),ry,1,rh,"#3C6A3C");
  const sx=v=>rx+Math.round((v-W.gx0)/(W.gx1-W.gx0)*rw);
  const sy=v=>ry+Math.round((v-W.top)/(W.bot-W.top)*rh);
  for(const q of P){
    const x=sx(q.x), y=sy(q.y);
    if(x<rx-1||x>rx+rw)continue;
    const eigen=humans().includes(q.team);
    const c=q.role==="K"?C.yel:(q.team===0?KIT[0].light:KIT[1].light);
    px(x,y,eigen?2:1,eigen?2:1,c);
    if(q===ctrl[q.team]&&eigen)px(x-1,y-2,3,1,C.wht);
  }
  px(sx(ball.x),sy(ball.y),2,2,C.wht)}
function krachtBalk(){
  /* Balkje bij je speler zolang je de trapknop vasthoudt: je ziet hoe ver je speelt. */
  const p=ctrl[0];
  if(!p||!humans().includes(0)||p.fireT==null||state!=="play")return;
  const t=Math.max(0,Math.min(1,p.fireT));
  const X=snap(SX(p.x,p.y)), y=Math.round(p.y)-Math.round(p.z)-36;
  px(X-9,y,20,3,"rgba(0,0,0,.55)");
  px(X-8,y+1,Math.round(18*t),1,t>.8?C.yel:C.wht)}
function hud(){
  if(state==="herhaling"){
    if(Math.floor(stateT*3)%2===0){             // knippert anderhalf keer per seconde
      px(292,4,16,18,C.blk);
      txt("H",300,6,C.wht,14)}
    txt("TIK OM DOOR TE GAAN",160,178,C.lgrey);
    return}
  if(msg)txt(msg,160,58,C.yel,16)}
function trophy(x,y){                           // beker voor de winnaar
  const G="#E8C040", G2="#A08018", B="#8B5A18";
  px(x-10,y,20,4,G);px(x-8,y+2,16,10,G);
  px(x-6,y+12,12,4,G2);
  px(x-3,y+15,6,6,G2);
  px(x-9,y+21,18,4,B);px(x-11,y+24,22,4,B);
  px(x-14,y+2,4,8,G);px(x-13,y+9,3,3,G);
  px(x+10,y+2,4,8,G);px(x+10,y+9,3,3,G);
  px(x-6,y+3,4,6,"#FFF0A0")}
function endBox(){
  px(46,70,228,60,C.blk);ctx.strokeStyle=C.grey;ctx.lineWidth=1;ctx.strokeRect(48,72,224,56);
  if(state==="halftime"){txt("RUST",160,78,C.yel,16);
    txt("UTRECHT "+score[0]+" - "+score[1]+" GASTEN",160,100,C.wht);
    txt("KICK VOOR DE TWEEDE HELFT",160,114,C.lgrey)}
  else{
    const gelijk=score[0]===score[1];
    const r=gelijk?"GELIJKSPEL":(score[0]>score[1]?"UTRECHT WINT":"GASTEN WINNEN");
    if(!gelijk){
      px(40,50,240,84,C.blk);ctx.strokeStyle=C.grey;ctx.lineWidth=1;ctx.strokeRect(42,52,236,80);
      trophy(160,56);
      txt(r,160,90,C.yel,16);
      txt(score[0]+" - "+score[1],160,110,C.wht);
      txt("KICK VOOR HET MENU",160,121,C.lgrey);
      return}
    txt("EINDE",160,78,C.yel,16);
    txt(r+"   "+score[0]+" - "+score[1],160,100,C.wht);
    txt("KICK VOOR HET MENU",160,114,C.lgrey)}}

let last=0;
function frame(ts){
  const dt=Math.min(.033,(ts-last)/1000);last=ts;
  update(dt);
  if(state==="menu"){if(AC&&AC.state==="running")speelDeun(TITELDEUN,"titel",true);
    title();requestAnimationFrame(frame);return}
  crowd();scoreboards();pitch();
  goalpost(0,"net");goalpost(1,"net");
  const order=[...P,ref].sort((a,b)=>a.y-b.y);
  let drawn=false;
  for(const p of order){
    if(!drawn&&p.y>ball.y){drawBall();drawn=true}
    drawPlayer(p)}
  if(!drawn)drawBall();
  goalpost(0,"frame");goalpost(1,"frame");
  if(state!=="ceremonie"&&state!=="menu"&&deunNu&&deunNu!=="goal")stopMuziek();
  penMik();
  radar();
  krachtBalk();
  if(state==="ceremonie")ceremonie();
  hud();
  if(state==="halftime"||state==="fulltime")endBox();
  if(state==="halftime"){
    txt("TIJD VOOR EEN WARM WORSIE!",160,138,C.tan,10);
    /* Wedstrijdcijfers bij de rust: geeft een helft betekenis. */
    const tot=stat.bezit[0]+stat.bezit[1]||1;
    const b0=Math.round(stat.bezit[0]/tot*100);
    txt("BALBEZIT   "+b0+" - "+(100-b0),160,152,C.wht,8);
    txt("SCHOTEN    "+stat.schoten[0]+" - "+stat.schoten[1],160,162,C.wht,8);
    txt("CORNERS    "+stat.corners[0]+" - "+stat.corners[1],160,172,C.wht,8)}
  requestAnimationFrame(frame)}
build();reset(0);
requestAnimationFrame(frame);
</script>
