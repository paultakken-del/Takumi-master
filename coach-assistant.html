/* ── Schema-generator ────────────────────────────────────────────────
   1. Gelijke speeltijd: bankbeurten round-robin verdeeld (verschil max 1 blok),
      nooit twee blokken achter elkaar op de bank zolang dat kan.
   2. Voorkeurspositie: per blok een greedy matching op score
      (1e voorkeur > 2e > 3e), met bonus voor dezelfde positie als vorig blok. */
function generateSchedule(players, seed, vasteBasis, seizoenTot) {
  const field = players.filter((p) => p.aanwezig && !p.keeper);
  const P = field.length;
  if (P < 10) return { error: `Te weinig veldspelers: ${P} aanwezig, 10 nodig.` };

  const benchPerBlock = P - 10;
  const fieldIds = new Set(field.map((p) => p.id));

  // Per-seed geroteerde volgorde voor variatie bij gelijke gevallen
  const order = [...field];
  let s = seed;
  for (let i = order.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = s % (i + 1);
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.sort((a, z) => (seizoenTot?.[z.id] || 0) - (seizoenTot?.[a.id] || 0));

  let benchByBlock;
  if (vasteBasis) {
    // Handmatige basis: blok 1/8 ligt vast, de bankbeurten van de rest van de
    // wedstrijd worden er eerlijk omheen verdeeld (spreiding blijft max 1 blok).
    const vals = Object.values(vasteBasis);
    if (vals.length !== 10 || new Set(vals).size !== 10 || !vals.every((id) => fieldIds.has(id))) {
      return { error: "Beginopstelling onvolledig: kies 10 verschillende aanwezige veldspelers (of wis de beginopstelling)." };
    }
    const benchCount = {};
    field.forEach((p) => (benchCount[p.id] = 0));
    const bench0 = field.filter((p) => !vals.includes(p.id)).map((p) => p.id);
    bench0.forEach((id) => (benchCount[id] = 1));
    benchByBlock = [bench0];
    let prevBench = new Set(bench0);
    const rank = {};
    order.forEach((p, i) => (rank[p.id] = i));
    for (let b = 1; b < 8; b++) {
      const sorted = field.map((p) => p.id).sort((a, z) => {
        if (benchCount[a] !== benchCount[z]) return benchCount[a] - benchCount[z];
        const pa = prevBench.has(a) ? 1 : 0, pz = prevBench.has(z) ? 1 : 0;
        if (pa !== pz) return pa - pz;
        const sa = seizoenTot?.[a] || 0, sz = seizoenTot?.[z] || 0;
        if (sa !== sz) return sz - sa;
        return ((rank[a] + b * 3) % P) - ((rank[z] + b * 3) % P);
      });
      const bench = sorted.slice(0, benchPerBlock);
      bench.forEach((id) => benchCount[id]++);
      benchByBlock.push(bench);
      prevBench = new Set(bench);
    }
  } else {
    benchByBlock = BLOCKS.map(() => []);
    let cursor = 0;
    for (let b = 0; b < BLOCKS.length; b++) {
      for (let k = 0; k < benchPerBlock; k++) {
        benchByBlock[b].push(order[cursor % P].id);
        cursor++;
      }
    }
  }

  const blocks = [];
  let prevAssign = {};
  for (let b = 0; b < BLOCKS.length; b++) {
    if (b === 0 && vasteBasis) {
      const assign = { ...vasteBasis };
      blocks.push({ label: BLOCKS[0], assign, bench: benchByBlock[0] });
      prevAssign = assign;
      continue;
    }
    const benchSet = new Set(benchByBlock[b]);
    const onField = field.filter((p) => !benchSet.has(p.id));
    const pairs = [];
    for (const p of onField) {
      for (const pos of POSITIONS) {
        const pi = p.prefs.indexOf(pos.code);
        let score = pi === 0 ? 6 : pi === 1 ? 4 : pi === 2 ? 2 : 0;
        if (prevAssign[pos.code] === p.id) score += 3; // continuïteit
        pairs.push({ id: p.id, pos: pos.code, score });
      }
    }
    pairs.sort((a, z) => z.score - a.score);
    const assign = {};
    const placed = new Set();
    for (const pr of pairs) {
      if (assign[pr.pos] !== undefined || placed.has(pr.id)) continue;
      assign[pr.pos] = pr.id;
      placed.add(pr.id);
    }
    blocks.push({ label: BLOCKS[b], assign, bench: benchByBlock[b] });
    prevAssign = assign;
  }

  const stats = {};
  for (const p of field) stats[p.id] = { played: 0, prefHits: 0 };
  for (const bl of blocks) {
    for (const [pos, id] of Object.entries(bl.assign)) {
      stats[id].played++;
      const pl = field.find((f) => f.id === id);
      if (pl.prefs.includes(pos)) stats[id].prefHits++;
    }
  }
  return { blocks, stats, benchPerBlock };
}

function subsBetween(prev, curr, playersById) {
  // Sluitende koppeling: elke inkomer krijgt precies één unieke uitgaande
  // speler (liefst degene die op dezelfde positie stond), en uitgaande
  // spelers zonder vervanger (mogelijk na uitval) worden apart benoemd.
  const prevIds = new Set(Object.values(prev.assign));
  const currIds = new Set(Object.values(curr.assign));
  const outs = Object.entries(prev.assign)
    .filter(([, id]) => !currIds.has(id))
    .map(([pos, id]) => ({ pos, id }));
  const ins = Object.entries(curr.assign).filter(([, id]) => !prevIds.has(id));
  const used = new Set();
  const subs = ins.map(([pos, id]) => {
    let voor = outs.find((o) => o.pos === pos && !used.has(o.id));
    if (!voor) voor = outs.find((o) => !used.has(o.id));
    if (voor) used.add(voor.id);
    return { inId: id, pos, voorId: voor ? voor.id : undefined };
  });
  outs.filter((o) => !used.has(o.id)).forEach((o) => subs.push({ voorId: o.id, pos: o.pos }));
  return subs;
}

function Pitch({ block, playersById, keeper }) {
  const w = 300, h = 380;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", borderRadius: 14, display: "block" }} role="img" aria-label={`Opstelling ${block.label}`}>
      <rect width={w} height={h} fill={C.pitch} rx="14" />
      <g stroke="rgba(255,255,255,.55)" strokeWidth="2" fill="none">
        <rect x="10" y="10" width={w - 20} height={h - 20} rx="6" />
        <line x1="10" y1={h / 2} x2={w - 10} y2={h / 2} />
        <path d={`M ${w / 2 - 70} 10 A 70 70 0 0 0 ${w / 2 + 70} 10`} />
        <path d={`M ${w / 2 - 70} ${h - 10} A 70 70 0 0 1 ${w / 2 + 70} ${h - 10}`} />
        <line x1="10" y1={h * 0.24} x2={w - 10} y2={h * 0.24} strokeDasharray="4 6" />
        <line x1="10" y1={h * 0.76} x2={w - 10} y2={h * 0.76} strokeDasharray="4 6" />
      </g>
      {keeper && (
        <g>
          <circle cx={w / 2} cy={h - 30} r="17" fill="#F2C230" stroke={C.pitchDark} strokeWidth="1.5" />
          <text x={w / 2} y={h - 32} textAnchor="middle" fontSize="9" fontWeight="800" fill={C.ink}>K</text>
          <text x={w / 2} y={h - 21} textAnchor="middle" fontSize="8.5" fill={C.ink}>
            {keeper.name.slice(0, 7)}
          </text>
        </g>
      )}
      {POSITIONS.map((pos) => {
        const id = block.assign[pos.code];
        const pl = playersById[id];
        const cx = (pos.x / 100) * (w - 40) + 20;
        const cy = (pos.y / 100) * (h - 60) + 20;
        return (
          <g key={pos.code}>
            <circle cx={cx} cy={cy} r="17" fill={C.chalk} stroke={C.pitchDark} strokeWidth="1.5" />
            <text x={cx} y={cy - 2} textAnchor="middle" fontSize="9" fontWeight="800" fill={C.ink}>{pos.code}</text>
            <text x={cx} y={cy + 9} textAnchor="middle" fontSize="8.5" fill={C.inkSoft}>
              {pl ? pl.name.slice(0, 7) : "—"}
            </text>
          </g>
        );
      })}
    </svg>
  );
}
