function HockeyWisselCoach() {
  const [players, setPlayers] = useState(DEMO);
  const [tab, setTab] = useState("selectie");
  const [seed, setSeed] = useState(7);
  const [result, setResult] = useState(null);
  const [openBlock, setOpenBlock] = useState(0);
  const [kwartMin, setKwartMin] = useState(17.5);
  const [uitvalId, setUitvalId] = useState("");
  const [basis, setBasis] = useState({});
  const [matches, setMatches] = useState([]);
  const [activeMatchId, setActiveMatchId] = useState("");
  const [turf, setTurf] = useState({});
  const [turfSpeler, setTurfSpeler] = useState("");
  const [scoreVoor, setScoreVoor] = useState(0);
  const [scoreTegen, setScoreTegen] = useState(0);
  const [nmDatum, setNmDatum] = useState("");
  const [nmTegen, setNmTegen] = useState("");
  const [nmThuis, setNmThuis] = useState(true);
  const [tekenen, setTekenen] = useState(false);
  const [penKleur, setPenKleur] = useState("#F2C230");
  const canvasRef = useRef(null);
  const penRef = useRef({ bezig: false, x: 0, y: 0 });

  const canvasKlaar = (el) => {
    canvasRef.current = el;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    if (el.width !== Math.round(rect.width * dpr)) {
      el.width = Math.round(rect.width * dpr);
      el.height = Math.round(rect.height * dpr);
    }
  };
  const penPunt = (e) => {
    const el = canvasRef.current;
    const rect = el.getBoundingClientRect();
    return { x: (e.clientX - rect.left) * (el.width / rect.width), y: (e.clientY - rect.top) * (el.height / rect.height) };
  };
  const penStart = (e) => {
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* niet ondersteund */ }
    penRef.current = { bezig: true, ...penPunt(e) };
  };
  const penBeweeg = (e) => {
    if (!penRef.current.bezig) return;
    const el = canvasRef.current;
    const ctx = el.getContext("2d");
    const p = penPunt(e);
    ctx.strokeStyle = penKleur;
    ctx.lineWidth = 4.5 * (el.width / el.getBoundingClientRect().width);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(penRef.current.x, penRef.current.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    penRef.current = { bezig: true, ...p };
  };
  const penStop = () => { penRef.current.bezig = false; };
  const wisTekening = () => {
    const el = canvasRef.current;
    if (el) el.getContext("2d").clearRect(0, 0, el.width, el.height);
  };

  const [tipTekst, setTipTekst] = useState("");
  const [tips, setTips] = useState(null);
  const [tipsBezig, setTipsBezig] = useState(false);
  const [tipFout, setTipFout] = useState("");

  const vraagTips = async () => {
    if (!tipTekst.trim() || tipsBezig) return;
    setTipsBezig(true); setTipFout(""); setTips(null);
    try {
      const r = await fetch("/api/coach-tip", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          code: normCode(sync.code), pin: sync.pin, tekst: tipTekst.trim(),
          context: { kwart: Math.min(4, Math.floor(liveBlock / 2) + 1), blok: BLOCKS[liveBlock], voor: scoreVoor, tegen: scoreTegen },
        }),
      });
      if (r.status === 403) throw new Error("vul eerst je teamcode en pincode in (Selectie)");
      if (!r.ok) throw new Error("tips ophalen mislukt — probeer nog eens");
      const d = await r.json();
      setTips(d.tips);
    } catch (err) {
      setTipFout(err.message);
    }
    setTipsBezig(false);
  };
  const [uitvalNote, setUitvalNote] = useState(null);
  const [running, setRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0); // zuivere speeltijd in seconden
  const [adhocOut, setAdhocOut] = useState("");
  const [adhocIn, setAdhocIn] = useState("");
  const [saveMsg, setSaveMsg] = useState("");

  const [sync, setSync] = useState({ code: "", pin: "" });

  const maakPayload = () => JSON.stringify({ players, kwartMin, result, seed, basis, matches, activeMatchId, turf, scoreVoor, scoreTegen });
  const normCode = (c) => (c || "").trim().toLowerCase().replace(/[^a-z0-9-]/g, "");

  const hydrate = (value) => {
    const s = JSON.parse(value);
    if (Array.isArray(s.players) && s.players.length) setPlayers(s.players);
    if (s.kwartMin) setKwartMin(s.kwartMin);
    if (s.result?.blocks) setResult(s.result);
    if (s.seed) setSeed(s.seed);
    if (s.basis && typeof s.basis === "object") setBasis(s.basis);
    if (Array.isArray(s.matches)) setMatches(s.matches);
    if (s.activeMatchId !== undefined) setActiveMatchId(s.activeMatchId);
    if (s.turf && typeof s.turf === "object") setTurf(s.turf);
    if (typeof s.scoreVoor === "number") setScoreVoor(s.scoreVoor);
    if (typeof s.scoreTegen === "number") setScoreTegen(s.scoreTegen);
  };

  const STORAGE_KEY = "wisselcoach-state";
  const SYNC_KEY = "wisselcoach-sync";

  const updateSync = (patch) => {
    const next = { ...sync, ...patch };
    setSync(next);
    try { window.localStorage?.setItem(SYNC_KEY, JSON.stringify(next)); } catch { /* geen localStorage */ }
  };

  /* Gedeelde opslag op de webserver: /api/team/{teamcode}, beveiligd met pincode.
     Iedere coach met dezelfde teamcode + pincode werkt met hetzelfde team. */
  const cloudGet = async (cfg) => {
    const r = await fetch(`/api/team/${normCode(cfg.code)}?pin=${encodeURIComponent(cfg.pin)}`);
    if (r.status === 404) return null;
    if (r.status === 403) throw new Error("pincode klopt niet");
    if (!r.ok || !(r.headers.get("Content-Type") || "").includes("json")) {
      throw new Error("gedeelde opslag niet bereikbaar");
    }
    const d = await r.json();
    return d.state ?? null;
  };

  const cloudSet = async (cfg, payload) => {
    const r = await fetch(`/api/team/${normCode(cfg.code)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: cfg.pin, state: payload }),
    });
    if (r.status === 403) throw new Error("pincode klopt niet");
    if (!r.ok) throw new Error("gedeelde opslag niet bereikbaar");
  };

  /* Lokale opslag-adapter: eerst de Claude-artifactopslag proberen, anders
     localStorage (webserver/browser), anders de tekstbackup als vangnet. */
  const storageGet = async () => {
    try {
      if (typeof window !== "undefined" && window.storage?.get) {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res?.value) return res.value;
      }
    } catch { /* artifactopslag niet beschikbaar */ }
    try {
      const v = window.localStorage?.getItem(STORAGE_KEY);
      if (v) return v;
    } catch { /* localStorage geblokkeerd (bijv. binnen Claude) */ }
    return null;
  };

  const storageSet = async (payload) => {
    try {
      if (typeof window !== "undefined" && window.storage?.set) {
        const res = await window.storage.set(STORAGE_KEY, payload, false);
        if (res) return true;
      }
    } catch { /* artifactopslag niet beschikbaar */ }
    try {
      window.localStorage?.setItem(STORAGE_KEY, payload);
      if (window.localStorage?.getItem(STORAGE_KEY) === payload) return true;
    } catch { /* localStorage geblokkeerd */ }
    return false;
  };

  /* Bij openen: eerst gedeelde opslag proberen (als teamcode bekend), dan lokaal */
  useEffect(() => {
    (async () => {
      let cfg = { code: "", pin: "" };
      try {
        const raw = window.localStorage?.getItem(SYNC_KEY);
        if (raw) { cfg = JSON.parse(raw); setSync(cfg); }
      } catch { /* geen syncconfig */ }
      try {
        if (cfg.code && cfg.pin) {
          const v = await cloudGet(cfg);
          if (v) { hydrate(v); return; }
        }
      } catch { /* gedeelde opslag niet bereikbaar — val terug op lokaal */ }
      try {
        const value = await storageGet();
        if (value) hydrate(value);
      } catch { /* niets opgeslagen — start met de demo-selectie */ }
    })();
  }, []);

  const opslaan = async (payloadOverride) => {
    let payload;
    if (typeof payloadOverride === "string") {
      payload = payloadOverride;
    } else {
      let matchesVoorOpslag = matches;
      if (normCode(sync.code) && sync.pin && matches.length === 0) {
        try {
          const v = await cloudGet(sync);
          if (v) {
            const s = JSON.parse(v);
            if (Array.isArray(s.matches) && s.matches.length) {
              matchesVoorOpslag = s.matches;
              setMatches(s.matches); // wedstrijdschema van de server behouden
            }
          }
        } catch { /* server niet bereikbaar — gewoon lokaal beeld opslaan */ }
      }
      payload = JSON.stringify({ players, kwartMin, result, seed, basis, matches: matchesVoorOpslag, activeMatchId, turf, scoreVoor, scoreTegen });
    }
    let prefix = "";
    if (normCode(sync.code) && sync.pin) {
      try {
        await cloudSet(sync, payload);
        setSaveMsg("Opgeslagen ✓ — gedeeld onder teamcode " + normCode(sync.code));
        setTimeout(() => setSaveMsg(""), 4000);
        return;
      } catch (err) {
        prefix = `Gedeeld opslaan mislukt (${err.message}) — `;
      }
    }
    const gelukt = await storageSet(payload);
    if (gelukt) {
      setSaveMsg(prefix + "opgeslagen ✓ op dit apparaat");
    } else {
      setSaveMsg(prefix + "lokaal opslaan is ook niet gelukt — controleer je verbinding");
    }
    setTimeout(() => setSaveMsg(""), 5000);
  };

  const laadVanCode = async () => {
    try {
      if (!normCode(sync.code) || !sync.pin) {
        setSaveMsg("Vul eerst teamcode en pincode in");
      } else {
        const v = await cloudGet(sync);
        if (v) { hydrate(v); setSaveMsg("Teamdata geladen ✓"); }
        else setSaveMsg("Nog niets opgeslagen onder deze teamcode");
      }
    } catch (err) {
      setSaveMsg(`Laden mislukt: ${err.message}`);
    }
    setTimeout(() => setSaveMsg(""), 4000);
  };

  const blockSec = (kwartMin * 60) / 2;
  const totalSec = blockSec * 8;
  useEffect(() => {
    if (!running) return;
    const t = setInterval(() => setElapsed((e) => Math.min(totalSec, e + 1)), 1000);
    return () => clearInterval(t);
  }, [running, totalSec]);
  const liveBlock = Math.min(7, Math.floor(elapsed / blockSec));
  const restInBlock = Math.max(0, Math.ceil(blockSec * (liveBlock + 1) - elapsed));
  const fmtClock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  const audioRef = useRef(null);
  const vorigeRestRef = useRef(null);
  const piep = (n) => {
    try {
      const ctx = audioRef.current;
      if (ctx) for (let i = 0; i < n; i++) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = 880;
        g.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.28);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.28 + 0.2);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + i * 0.28); o.stop(ctx.currentTime + i * 0.28 + 0.22);
      }
      if (navigator.vibrate) navigator.vibrate(n === 1 ? 250 : [200, 120, 200]);
    } catch { /* geen audio beschikbaar */ }
  };
  const springNaarKwart = (q) => {
    vorigeRestRef.current = null;
    setElapsed((q - 1) * blockSec * 2);
  };

  useEffect(() => {
    if (!running) { vorigeRestRef.current = null; return; }
    const vorige = vorigeRestRef.current;
    if (vorige !== null) {
      if (vorige > 60 && restInBlock <= 60) piep(1);              // nog 1 minuut
      if (restInBlock > vorige) piep(2);                          // nieuw blok: wisselen
      if (vorige > 0 && restInBlock === 0 && elapsed >= totalSec) piep(3); // eindsignaal
    }
    vorigeRestRef.current = restInBlock;
  }, [restInBlock, running]);

  const playersById = useMemo(() => Object.fromEntries(players.map((p) => [p.id, p])), [players]);
  const aanwezigVeld = players.filter((p) => p.aanwezig && !p.keeper).length;
  const keeper = players.find((p) => p.keeper && p.aanwezig);

  const seizoenTot = useMemo(() => {
    const t = {};
    matches.filter((m) => m.gesloten).forEach((m) =>
      Object.entries(m.stats || {}).forEach(([id, s]) => { t[id] = (t[id] || 0) + (s.b || 0); }));
    return t;
  }, [matches]);

  const actieveBasis = () => {
    const gekozen = Object.fromEntries(Object.entries(basis).filter(([, v]) => v));
    return Object.keys(gekozen).length ? gekozen : undefined;
  };

  const genereer = (newSeed) => {
    const s = newSeed ?? seed;
    setSeed(s);
    setResult(generateSchedule(players, s, actieveBasis(), seizoenTot));
    setTab("schema");
    setOpenBlock(0);
    setUitvalNote(null);
  };

  /* Speler valt uit vanaf blok X: alles vóór X blijft staan, daarna wordt de
     speler alleen op zijn eigen plekken vervangen door de bankspeler met de
     minste speeltijd (bij gelijk: beste voorkeursmatch). Rest blijft intact. */
  const valUit = (playerId, fromBlock) => {
    if (!result?.blocks || !playerId) return;
    const blocks = result.blocks.map((b) => ({ ...b, assign: { ...b.assign }, bench: [...b.bench] }));
    const playedUpTo = {};
    players.forEach((p) => (playedUpTo[p.id] = 0));
    blocks.forEach((b, i) => { if (i < fromBlock) Object.values(b.assign).forEach((id) => playedUpTo[id]++); });
    const issues = [];
    for (let b = fromBlock; b < blocks.length; b++) {
      const bl = blocks[b];
      bl.bench = bl.bench.filter((id) => id !== playerId);
      const posEntry = Object.entries(bl.assign).find(([, id]) => id === playerId);
      if (posEntry) {
        const [pos] = posEntry;
        const onField = new Set(Object.values(bl.assign));
        const candidates = bl.bench.filter((id) => !onField.has(id));
        if (candidates.length === 0) {
          delete bl.assign[pos];
          issues.push(`${BLOCKS[b]}: geen vervanger voor ${POS_BY_CODE[pos].name}`);
        } else {
          candidates.sort((a, z) => {
            if (playedUpTo[a] !== playedUpTo[z]) return playedUpTo[a] - playedUpTo[z];
            const pa = playersById[a].prefs.indexOf(pos), pz = playersById[z].prefs.indexOf(pos);
            return (pa < 0 ? 9 : pa) - (pz < 0 ? 9 : pz);
          });
          const rep = candidates[0];
          bl.assign[pos] = rep;
          bl.bench = bl.bench.filter((id) => id !== rep);
        }
      }
      bl.patched = true;
      Object.values(bl.assign).forEach((id) => playedUpTo[id]++);
    }
    const stats = {};
    blocks.forEach((bl) => Object.entries(bl.assign).forEach(([pos, id]) => {
      if (!stats[id]) stats[id] = { played: 0, prefHits: 0 };
      stats[id].played++;
      if (playersById[id]?.prefs.includes(pos)) stats[id].prefHits++;
    }));
    setResult({ ...result, blocks, stats });
    setUitvalNote({ name: playersById[playerId]?.name, from: BLOCKS[fromBlock], issues });
  };

  /* Speler keert terug (bijv. na blessurebehandeling) vanaf blok X. Zelfde
     minimale impact als uitvallen: alleen de terugkeerder krijgt plekken,
     en steeds van de veldspeler die tot dan toe de meeste blokken speelt —
     zo trekt de speeltijd vanzelf weer recht. Lege posities (ontstaan bij
     uitval zonder vervanger) worden als eerste weer gevuld. */
  const keerTerug = (playerId, fromBlock) => {
    if (!result?.blocks || !playerId) return;
    const blocks = result.blocks.map((b) => ({ ...b, assign: { ...b.assign }, bench: [...b.bench] }));
    const totals = {};
    blocks.forEach((b) => Object.values(b.assign).forEach((id) => { totals[id] = (totals[id] || 0) + 1; }));
    for (let b = fromBlock; b < blocks.length; b++) {
      const bl = blocks[b];
      const onField = new Set(Object.values(bl.assign));
      if (onField.has(playerId)) continue;
      if (!bl.bench.includes(playerId)) bl.bench.push(playerId);
      bl.patched = true;
      const leeg = POSITIONS.find((p) => bl.assign[p.code] === undefined);
      if (leeg) {
        bl.assign[leeg.code] = playerId;
        bl.bench = bl.bench.filter((id) => id !== playerId);
        totals[playerId] = (totals[playerId] || 0) + 1;
        continue;
      }
      let best = null;
      for (const [pos, id] of Object.entries(bl.assign)) {
        const t = totals[id] || 0;
        const prefRank = playersById[playerId]?.prefs.indexOf(pos) ?? -1;
        const score = t * 10 + (prefRank >= 0 ? 3 - prefRank : 0);
        if (!best || score > best.score) best = { pos, id, t, score };
      }
      if (best && best.t > (totals[playerId] || 0) + 1) {
        bl.assign[best.pos] = playerId;
        bl.bench = bl.bench.filter((id) => id !== playerId);
        bl.bench.push(best.id);
        totals[best.id]--;
        totals[playerId] = (totals[playerId] || 0) + 1;
      }
    }
    const stats = {};
    blocks.forEach((bl2) => Object.entries(bl2.assign).forEach(([pos, id]) => {
      if (!stats[id]) stats[id] = { played: 0, prefHits: 0 };
      stats[id].played++;
      if (playersById[id]?.prefs.includes(pos)) stats[id].prefHits++;
    }));
    setResult({ ...result, blocks, stats });
    setUitvalNote({ name: playersById[playerId]?.name, from: BLOCKS[fromBlock], issues: [], terug: true });
  };

  const turfDoelpunt = () => {
    const id = Number(turfSpeler); if (!id) return;
    const t = turf[id] || {};
    setTurf({ ...turf, [id]: { ...t, d: (t.d || 0) + 1 } });
    setScoreVoor(scoreVoor + 1);
  };
  const turfKaart = (kleur) => {
    const id = Number(turfSpeler); if (!id) return;
    const t = turf[id] || {};
    setTurf({ ...turf, [id]: { ...t, [kleur]: (t[kleur] || 0) + 1 } });
  };
  const [verslagOpenId, setVerslagOpenId] = useState(null);
  const [verslagWoorden, setVerslagWoorden] = useState("");
  const [verslagBezig, setVerslagBezig] = useState(false);
  const [verslagFout, setVerslagFout] = useState("");

  const maakVerslag = async (m) => {
    if (verslagBezig) return;
    setVerslagBezig(true); setVerslagFout("");
    try {
      const scorers = Object.entries(m.stats || {})
        .filter(([, s]) => (s.d || 0) > 0)
        .map(([id, s]) => ({ naam: playersById[id]?.name || "een speler", n: s.d }));
      const r = await fetch("/api/verslag", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          code: normCode(sync.code), pin: sync.pin,
          wedstrijd: { datum: m.datum, tegenstander: m.tegenstander, thuis: m.thuis, voor: m.voor, tegen: m.tegen },
          scorers, steekwoorden: verslagWoorden.trim(),
        }),
      });
      if (r.status === 403) throw new Error("vul eerst je teamcode en pincode in (Selectie)");
      if (!r.ok) throw new Error("verslag maken mislukt — probeer nog eens");
      const d = await r.json();
      const next = matches.map((x) => (x.id === m.id ? { ...x, verslag: d.verslag } : x));
      setMatches(next);
      opslaan(JSON.stringify({ players, kwartMin, result, seed, basis, matches: next, activeMatchId, turf, scoreVoor, scoreTegen }));
    } catch (err) {
      setVerslagFout(err.message);
    }
    setVerslagBezig(false);
  };

  const [waTekst, setWaTekst] = useState("");
  const [waBezig, setWaBezig] = useState(false);
  const [waFout, setWaFout] = useState("");
  const [waResultaat, setWaResultaat] = useState(null);

  const WA_VRAAG = "Mannen, voor het wisselschema: stuur je top 3 favoriete posities (1 = liefst spelen). Kies uit: Laatste man, Voorlaatste man, Linksachter, Rechtsachter, Linkshalf, Middenmid, Rechtshalf, Linksbuiten, Spits, Rechtsbuiten. Bijvoorbeeld: 1. Spits 2. Rechtsbuiten 3. Middenmid";

  const kopieerVraag = async () => {
    try { await navigator.clipboard.writeText(WA_VRAAG); setSaveMsg("Vraag gekopieerd ✓ — plak hem in de groepsapp"); }
    catch { setSaveMsg("Kopiëren lukte niet"); }
    setTimeout(() => setSaveMsg(""), 4000);
  };

  const pasVoorkeurenToe = (lijst) => {
    const perNaam = Object.fromEntries(lijst.map((v) => [v.speler, v.posities]));
    setPlayers(players.map((p) => {
      const nieuw = perNaam[p.name];
      if (!nieuw || !nieuw.length || p.keeper) return p;
      const codes = nieuw.filter((c) => POS_BY_CODE[c]).slice(0, 3);
      const rest = p.prefs.filter((c) => !codes.includes(c));
      while (codes.length < 3) codes.push(rest.shift() || POSITIONS.find((x) => !codes.includes(x.code)).code);
      return { ...p, prefs: codes };
    }));
  };

  const [inzendingen, setInzendingen] = useState(null);
  const [inzBezig, setInzBezig] = useState(false);

  const kopieerUitnodiging = async () => {
    const code = normCode(sync.code);
    if (!code) { setWaFout("vul eerst je teamcode in (bovenaan)"); return; }
    const bericht = `Mannen, voor het wisselschema: tik op deze veldkaart je 3 favoriete posities aan (1 = liefst spelen). Duurt 20 seconden: https://takumi-master.com/voorkeur.html?team=${code}`;
    try { await navigator.clipboard.writeText(bericht); setSaveMsg("Uitnodiging gekopieerd ✓ — plak hem in de groepsapp"); }
    catch { setSaveMsg("Kopiëren lukte niet"); }
    setTimeout(() => setSaveMsg(""), 4000);
  };

  const haalInzendingen = async () => {
    if (inzBezig) return;
    setInzBezig(true); setWaFout("");
    try {
      const r = await fetch(`/api/voorkeur/${normCode(sync.code)}?pin=${encodeURIComponent(sync.pin)}&inzendingen=1`);
      if (r.status === 403 || r.status === 404) throw new Error("vul eerst je teamcode en pincode in (bovenaan)");
      if (!r.ok) throw new Error("ophalen mislukt — probeer nog eens");
      const d = await r.json();
      setInzendingen(d.inzendingen || {});
    } catch (err) {
      setWaFout(err.message);
    }
    setInzBezig(false);
  };

  const neemInzendingenOver = () => {
    if (!inzendingen) return;
    pasVoorkeurenToe(Object.entries(inzendingen).map(([speler, posities]) => ({ speler, posities })));
    setSaveMsg("Voorkeuren overgenomen ✓ — controleer de dropdowns en druk op Opslaan");
    setTimeout(() => setSaveMsg(""), 4500);
  };

  const verwerkVoorkeuren = async () => {
    if (!waTekst.trim() || waBezig) return;
    setWaBezig(true); setWaFout(""); setWaResultaat(null);
    try {
      const r = await fetch("/api/voorkeuren", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          code: normCode(sync.code), pin: sync.pin,
          tekst: waTekst.slice(0, 6000),
          spelers: players.filter((p) => !p.keeper).map((p) => p.name),
          posities: POSITIONS.map((p) => ({ code: p.code, naam: p.name })),
        }),
      });
      if (r.status === 403) throw new Error("vul eerst je teamcode en pincode in (bovenaan)");
      if (!r.ok) throw new Error("verwerken mislukt — probeer nog eens");
      const d = await r.json();
      pasVoorkeurenToe(d.voorkeuren || []);
      setWaResultaat(d);
      setWaTekst("");
    } catch (err) {
      setWaFout(err.message);
    }
    setWaBezig(false);
  };

  const addMatch = () => {
    if (!nmDatum || !nmTegen.trim()) return;
    const next = [...matches, { id: Date.now(), datum: nmDatum, tegenstander: nmTegen.trim(), thuis: nmThuis, gesloten: false }]
      .sort((a, z) => (a.datum > z.datum ? 1 : -1));
    setMatches(next);
    setNmTegen("");
  };

  /* Wedstrijd afsluiten: werkelijke blokken (incl. uitval en ingelaste wissels)
     plus doelpunten en kaarten bevriezen bij de gekozen wedstrijd, en direct
     naar de gedeelde opslag schrijven. */
  const sluitWedstrijd = () => {
    if (!activeMatchId) return;
    const stats = {};
    players.forEach((p) => {
      const t = turf[p.id] || {};
      const b = p.keeper ? 0 : (result?.stats?.[p.id]?.played || 0);
      if (b || t.d || t.gr || t.ge || t.ro) stats[p.id] = { b, d: t.d || 0, gr: t.gr || 0, ge: t.ge || 0, ro: t.ro || 0 };
    });
    const next = matches.map((m) => m.id === Number(activeMatchId)
      ? { ...m, gesloten: true, voor: scoreVoor, tegen: scoreTegen, stats, afwezig: players.filter((p) => !p.aanwezig).map((p) => p.name) } : m);
    setMatches(next);
    setTurf({}); setTurfSpeler(""); setScoreVoor(0); setScoreTegen(0); setActiveMatchId("");
    opslaan(JSON.stringify({ players, kwartMin, result, seed, basis, matches: next, activeMatchId: "", turf: {}, scoreVoor: 0, scoreTegen: 0 }));
  };

  /* Ingelaste wissel: alleen het huidige blok wordt aangepast — de erin-speler
     neemt de positie van de eruit-speler over, die naar de bank gaat. De
     geplande blokken erna blijven ongewijzigd; de wisselkaart naar het
     volgende blok rekent zichzelf automatisch opnieuw uit. */
  const wisselNu = (outId, inId) => {
    if (!result?.blocks || !outId || !inId) return;
    const blocks = result.blocks.map((b, i) =>
      i === liveBlock ? { ...b, assign: { ...b.assign }, bench: [...b.bench], patched: true } : b
    );
    const bl = blocks[liveBlock];
    const entry = Object.entries(bl.assign).find(([, id]) => id === outId);
    if (!entry) return;
    const [pos] = entry;
    bl.assign[pos] = inId;
    bl.bench = bl.bench.filter((id) => id !== inId).concat(outId);
    const stats = {};
    blocks.forEach((b) => Object.entries(b.assign).forEach(([p, id]) => {
      if (!stats[id]) stats[id] = { played: 0, prefHits: 0 };
      stats[id].played++;
      if (playersById[id]?.prefs.includes(p)) stats[id].prefHits++;
    }));
    setResult({ ...result, blocks, stats });
    setAdhocOut("");
    setAdhocIn("");
  };

  const upd = (id, patch) => setPlayers(players.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  const updPref = (id, idx, code) =>
    setPlayers(players.map((p) => {
      if (p.id !== id) return p;
      const prefs = [...p.prefs]; prefs[idx] = code; return { ...p, prefs };
    }));
  const addPlayer = () => {
    const id = Math.max(...players.map((p) => p.id)) + 1;
    setPlayers([...players, { id, name: `Speler ${id}`, prefs: ["MM", "LH", "RH"], keeper: false, aanwezig: true }]);
  };
  const setKeeper = (id) => setPlayers(players.map((p) => ({ ...p, keeper: p.id === id })));

  const fmtMin = (m) => String(Math.round(m * 100) / 100).replace(".", ",");
  const halfMin = fmtMin(kwartMin / 2);

  const S = {
    page: { minHeight: "100vh", background: C.chalk, color: C.ink, fontFamily: "'Barlow', system-ui, -apple-system, sans-serif", paddingBottom: 90 },
    display: { fontFamily: "'Archivo Black', 'Barlow', system-ui, sans-serif", color: C.bib },
    card: { background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14 },
    btn: { background: C.black, color: "#fff", border: "none", borderRadius: 999, padding: "13px 22px", fontSize: 16, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" },
    ghost: { background: "transparent", color: C.black, border: `1.5px solid ${C.black}`, borderRadius: 999, padding: "10px 18px", fontWeight: 700, cursor: "pointer", fontFamily: "inherit", fontSize: 14, whiteSpace: "nowrap" },
    select: { fontFamily: "inherit", fontSize: 16, padding: "6px 4px", borderRadius: 8, border: `1px solid ${C.line}`, background: C.chalk, color: C.ink, maxWidth: "100%" },
  };

  return (
    <div className="app-root" style={S.page}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;600;700&display=swap');
        button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid ${C.bib}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        .print-sheet { display: none; }
        @media print {
          .app-root { background: #fff !important; padding-bottom: 0 !important; }
          header, nav, main, .actionbar { display: none !important; }
          .print-sheet { display: block !important; }
        }
      `}</style>

      {/* Kop */}
      <header style={{ background: C.bib, color: "#fff", padding: "18px 18px 16px", borderRadius: "0 0 22px 22px", display: "flex", alignItems: "center", gap: 12 }}>
        <img src="/coach-assistant-icon-192.png" alt="" width="42" height="42"
          style={{ borderRadius: 11, display: "block", flexShrink: 0 }} />
        <div style={{ ...S.display, color: "#fff", fontSize: 24, lineHeight: 1.05, letterSpacing: "-0.5px", flex: 1 }}>
          COACH ASSISTANT
        </div>
        <div style={{ fontSize: 11.5, opacity: 0.75, alignSelf: "flex-end", paddingBottom: 3, fontVariantNumeric: "tabular-nums" }}>{APP_VERSIE}</div>
      </header>

      {/* Tabs */}
      <nav style={{ display: "flex", gap: 8, padding: "14px 14px 4px" }}>
        {[["selectie", "Selectie", "spelers"], ["schema", "Opstelling", "veld"], ["live", "Live", "klok"], ["speeltijd", "Speeltijd", "grafiek"], ["seizoen", "Seizoen", "kalender"]].map(([key, label, icoon]) => (
          <button key={key} onClick={() => setTab(key)} style={{
            ...S.ghost, flex: 1, padding: "10px 2px", fontSize: 12.5,
            background: tab === key ? C.black : "transparent",
            color: tab === key ? "#fff" : C.black,
          }}>{label}</button>
        ))}
      </nav>

      {/* ── SELECTIE ── */}
      {tab === "selectie" && (
        <main style={{ padding: 14, display: "grid", gap: 10 }}>
          {/* Team openen: teamcode + pincode, gedeeld over apparaten en coaches */}
          <div style={S.card}>
            <div style={{ ...S.display, fontSize: 13, marginBottom: 6 }}><Ico kind="spelers" />OPEN TEAM</div>
            <div style={{ fontSize: 13, color: C.inkSoft, marginBottom: 8 }}>
              Teamcode en pincode gelden op elk apparaat en voor elke mede-coach. Opslaan bewaart alles op de server onder deze code.
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <input value={sync.code} onChange={(e) => updateSync({ code: e.target.value })}
                placeholder="Teamcode, bijv. o16-5" autoCapitalize="none"
                style={{ ...S.select, flex: 1, minWidth: 130 }} aria-label="Teamcode" />
              <input value={sync.pin} onChange={(e) => updateSync({ pin: e.target.value })}
                placeholder="Pincode" type="password"
                style={{ ...S.select, width: 90 }} aria-label="Pincode" />
              <button onClick={laadVanCode} style={{ ...S.ghost, fontSize: 13 }}>Open</button>
            </div>
          </div>

          <div style={{ ...S.card, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
            <div>
              <div style={{ fontWeight: 700 }}>{aanwezigVeld} veldspelers aanwezig</div>
              <div style={{ fontSize: 13, color: C.inkSoft }}>
                {keeper ? `Keeper: ${keeper.name}` : "Nog geen keeper aangewezen"} · {Math.max(0, aanwezigVeld - 10)} wissel{aanwezigVeld - 10 === 1 ? "" : "s"} per blok
              </div>
            </div>
            <label style={{ fontSize: 13, color: C.inkSoft, display: "grid", gap: 2, textAlign: "right" }}>
              Kwart (min)
              <input type="number" min="4" max="20" step="0.5" value={kwartMin}
                onChange={(e) => setKwartMin(Number(e.target.value) || 17.5)}
                style={{ ...S.select, width: 64, textAlign: "center" }} />
            </label>
          </div>

          {players.map((p) => (
            <div key={p.id} style={{ ...S.card, opacity: p.aanwezig ? 1 : 0.45 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <input value={p.name} onChange={(e) => upd(p.id, { name: e.target.value })}
                  style={{ ...S.select, fontWeight: 700, flex: 1, minWidth: 100 }} aria-label="Naam" />
                <button onClick={() => setKeeper(p.id)} style={{
                  ...S.ghost, padding: "6px 12px", fontSize: 12,
                  background: p.keeper ? C.bib : "transparent",
                  color: p.keeper ? C.bibInk : C.black,
                  borderColor: p.keeper ? C.bib : C.black,
                }}>K</button>
                <button onClick={() => upd(p.id, { aanwezig: !p.aanwezig })} style={{ ...S.ghost, padding: "6px 12px", fontSize: 12 }}>
                  {p.aanwezig ? "Aanwezig" : "Afwezig"}
                </button>
                <button onClick={() => setPlayers(players.filter((x) => x.id !== p.id))}
                  style={{ ...S.ghost, padding: "6px 10px", fontSize: 12, color: C.out, borderColor: C.out }} aria-label={`Verwijder ${p.name}`}>✕</button>
              </div>
              {!p.keeper && (
                <div style={{ display: "flex", gap: 6, marginTop: 8, alignItems: "center", flexWrap: "wrap" }}>
                  <span style={{ fontSize: 12, color: C.inkSoft }}>Voorkeur</span>
                  {[0, 1, 2].map((i) => (
                    <select key={i} value={p.prefs[i]} onChange={(e) => updPref(p.id, i, e.target.value)}
                      style={S.select} aria-label={`Voorkeur ${i + 1} van ${p.name}`}>
                      {POSITIONS.map((pos) => (
                        <option key={pos.code} value={pos.code}>{i + 1}. {pos.name}</option>
                      ))}
                    </select>
                  ))}
                </div>
              )}
            </div>
          ))}

          <button onClick={addPlayer} style={S.ghost}>+ Speler toevoegen</button>

          {/* Voorkeursposities uitvragen: veldkaart-link, met WhatsApp-plak als vangnet */}
          <div style={S.card}>
            <div style={{ ...S.display, fontSize: 13, marginBottom: 6 }}><Ico kind="chat" />VOORKEUREN UITVRAGEN</div>
            <div style={{ fontSize: 13, color: C.inkSoft, marginBottom: 8 }}>
              Deel de link in de groepsapp: elke speler tikt zijn naam en zijn 3 posities aan op de veldkaart. Haal daarna de inzendingen op, neem ze over en druk op Opslaan.
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button onClick={kopieerUitnodiging} style={{ ...S.ghost, fontSize: 13 }}>Kopieer uitnodiging + link</button>
              <button onClick={haalInzendingen} disabled={inzBezig} style={{ ...S.ghost, fontSize: 13, opacity: inzBezig ? 0.5 : 1 }}>
                {inzBezig ? "…" : "Haal inzendingen op"}
              </button>
            </div>
            {waFout && <div style={{ fontSize: 13, color: C.out, fontWeight: 700, marginTop: 8 }}>{waFout}</div>}
            {inzendingen && (
              <div style={{ fontSize: 13.5, marginTop: 10 }}>
                {Object.keys(inzendingen).length === 0 && <div style={{ color: C.inkSoft }}>Nog geen inzendingen binnen.</div>}
                {Object.entries(inzendingen).map(([naam, pos]) => (
                  <div key={naam} style={{ padding: "2px 0" }}>
                    <b>{naam}</b> <span style={{ color: C.inkSoft }}>→ {pos.map((c) => POS_BY_CODE[c]?.name || c).join(", ")}</span>
                  </div>
                ))}
                {(() => {
                  const ontbreekt = players.filter((p) => !p.keeper && !inzendingen[p.name]).map((p) => p.name);
                  return ontbreekt.length ? <div style={{ color: C.inkSoft, marginTop: 4 }}>Nog niet ingevuld: {ontbreekt.join(", ")}</div> : null;
                })()}
                {Object.keys(inzendingen).length > 0 && (
                  <button onClick={neemInzendingenOver} style={{ ...S.ghost, fontSize: 13, marginTop: 8 }}>Neem over in de selectie</button>
                )}
              </div>
            )}

            <div style={{ borderTop: `1px solid ${C.line}`, marginTop: 12, paddingTop: 10, fontSize: 13, color: C.inkSoft, marginBottom: 8 }}>
              Of plak losse WhatsApp-antwoorden en laat AI ze vertalen:
            </div>
            <textarea value={waTekst} onChange={(e) => setWaTekst(e.target.value)} rows={3}
              placeholder="Plak hier de WhatsApp-antwoorden…"
              style={{ ...S.select, width: "100%", boxSizing: "border-box", fontSize: 16 }}
              aria-label="WhatsApp-antwoorden" />
            <button onClick={verwerkVoorkeuren} disabled={waBezig || !waTekst.trim()}
              style={{ ...S.ghost, fontSize: 13, marginTop: 8, opacity: waBezig || !waTekst.trim() ? 0.5 : 1 }}>
              {waBezig ? "…" : <><Ico kind="ai" />Verwerk</>}
            </button>
            {waResultaat && (
              <div style={{ fontSize: 13.5, marginTop: 10 }}>
                {(waResultaat.voorkeuren || []).map((v) => (
                  <div key={v.speler} style={{ padding: "2px 0" }}>
                    <b>{v.speler}</b> <span style={{ color: C.inkSoft }}>→ {v.posities.map((c) => POS_BY_CODE[c]?.name || c).join(", ")}</span>
                  </div>
                ))}
                {(waResultaat.voorkeuren || []).length === 0 && <div style={{ color: C.inkSoft }}>Geen voorkeuren herkend in de tekst.</div>}
                {(waResultaat.nietHerkend || []).length > 0 && (
                  <div style={{ color: C.inkSoft, marginTop: 4 }}>Niet aan een speler te koppelen: {waResultaat.nietHerkend.join(", ")}</div>
                )}
              </div>
            )}
          </div>
        </main>
      )}

      {/* ── SCHEMA ── */}
      {tab === "schema" && (
        <main style={{ padding: 14, display: "grid", gap: 10 }}>
          {/* Handmatige basisopstelling voor blok 1/8 */}
          <div style={S.card}>
            <div style={{ ...S.display, fontSize: 13, marginBottom: 6 }}><Ico kind="veld" />BEGINOPSTELLING (1/8)</div>
            <div style={{ fontSize: 13, color: C.inkSoft, marginBottom: 8 }}>
              Laat posities op "automatisch" staan of kies zelf wie er start. Bij <b>Genereer schema</b> wordt de rest van de wedstrijd om jouw beginopstelling heen doorgerekend — gelijke speeltijd blijft gelden.
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 12px" }}>
              {POSITIONS.map((pos) => (
                <label key={pos.code} style={{ fontSize: 12.5, color: C.inkSoft, display: "grid", gap: 2 }}>
                  {pos.name}
                  <select value={basis[pos.code] || ""} aria-label={`Beginopstelling ${pos.name}`}
                    onChange={(e) => setBasis({ ...basis, [pos.code]: e.target.value ? Number(e.target.value) : undefined })}
                    style={S.select}>
                    <option value="">— automatisch —</option>
                    {players.filter((p) => p.aanwezig && !p.keeper).map((p) => {
                      const elders = Object.entries(basis).some(([c, v]) => c !== pos.code && v === p.id);
                      return <option key={p.id} value={p.id}>{p.name}{elders ? " (al gekozen)" : ""}</option>;
                    })}
                  </select>
                </label>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
              <button onClick={() => {
                if (!result?.blocks) return;
                const b = {};
                POSITIONS.forEach((pos) => { b[pos.code] = result.blocks[0].assign[pos.code]; });
                setBasis(b);
              }} style={{ ...S.ghost, fontSize: 13 }} disabled={!result?.blocks}>Neem huidige 1/8 over</button>
              <button onClick={() => setBasis({})} style={{ ...S.ghost, fontSize: 13 }}>Wis beginopstelling</button>
            </div>
          </div>

          {!result && <div style={S.card}>Nog geen schema. Druk op <b>Genereer schema</b>.</div>}
          {result?.error && <div style={{ ...S.card, borderColor: C.out, color: C.out, fontWeight: 700 }}>{result.error}</div>}
          {result?.blocks && (
            <>
              <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 2 }}>
                {result.blocks.map((bl, i) => (
                  <button key={bl.label} onClick={() => setOpenBlock(i)} style={{
                    ...S.ghost, padding: "8px 13px", fontSize: 13, flexShrink: 0,
                    background: openBlock === i ? C.black : "transparent",
                    color: openBlock === i ? "#fff" : C.black,
                  }}>{bl.label}{bl.patched ? " •" : ""}</button>
                ))}
              </div>

              {/* Uitval tijdens de wedstrijd */}
              <div style={S.card}>
                <div style={{ ...S.display, fontSize: 13, marginBottom: 8 }}><Ico kind="wissel" />SPELER VALT UIT / KEERT TERUG</div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                  <select value={uitvalId} onChange={(e) => setUitvalId(e.target.value)} style={S.select} aria-label="Uitvallende speler">
                    <option value="">Kies speler…</option>
                    {players.filter((p) => p.aanwezig && !p.keeper).map((p) => (
                      <option key={p.id} value={p.id}>{p.name}</option>
                    ))}
                  </select>
                  <button onClick={() => valUit(Number(uitvalId), openBlock)} style={{ ...S.ghost, fontSize: 13 }}>
                    ▼ Uit vanaf {BLOCKS[openBlock]}
                  </button>
                  <button onClick={() => keerTerug(Number(uitvalId), openBlock)} style={{ ...S.ghost, fontSize: 13 }}>
                    ▲ Terug vanaf {BLOCKS[openBlock]}
                  </button>
                </div>
                {uitvalNote && (
                  <div style={{ fontSize: 13, color: C.inkSoft, marginTop: 8 }}>
                    <b style={{ color: C.ink }}>{uitvalNote.name}</b> {uitvalNote.terug
                      ? <>is vanaf {uitvalNote.from} weer in het schema opgenomen; de speeltijd trekt zich vanzelf recht (blokken met •).</>
                      : <>is uit het schema gehaald vanaf {uitvalNote.from}; alleen zijn/haar plekken zijn opnieuw ingevuld (blokken met •).</>} 
                    {uitvalNote.issues.map((msg, i) => (
                      <div key={i} style={{ color: C.out, fontWeight: 700 }}>{msg}</div>
                    ))}
                  </div>
                )}
              </div>

              {/* Wissels bij aanvang van dit blok */}
              {openBlock > 0 && (() => {
                const subs = subsBetween(result.blocks[openBlock - 1], result.blocks[openBlock], playersById);
                return subs.length > 0 && (
                  <div style={{ ...S.card, background: C.bib, border: "none" }}>
                    <div style={{ ...S.display, fontSize: 13, color: C.bibInk, marginBottom: 6 }}>
                      <Ico kind="wissel" />WISSELS BIJ START {result.blocks[openBlock].label}
                    </div>
                    {subs.map((sub, i) => (
                      <div key={i} style={{ display: "flex", gap: 8, alignItems: "baseline", fontSize: 15, color: C.bibInk, padding: "3px 0", flexWrap: "wrap" }}>
                        {sub.inId !== undefined && <>
                          <span style={{ fontWeight: 800, color: "#fff" }}>▲ {playersById[sub.inId]?.name}</span>
                          <span>op {POS_BY_CODE[sub.pos].name}</span>
                        </>}
                        {sub.voorId !== undefined && (
                          <span style={{ fontWeight: 800, color: "#fff" }}>▼ {playersById[sub.voorId]?.name}{sub.inId === undefined ? " eruit (niet vervangen)" : ""}</span>
                        )}
                      </div>
                    ))}
                  </div>
                );
              })()}

              <div style={{ position: "relative" }}>
                <Pitch block={result.blocks[openBlock]} playersById={playersById} keeper={keeper} />
                <canvas ref={canvasKlaar}
                  onPointerDown={penStart} onPointerMove={penBeweeg}
                  onPointerUp={penStop} onPointerLeave={penStop} onPointerCancel={penStop}
                  style={{ position: "absolute", inset: 0, width: "100%", height: "100%", borderRadius: 14, touchAction: "none", cursor: "crosshair", pointerEvents: tekenen ? "auto" : "none" }}
                  aria-label="Tekenlaag over het veld" />
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                <button onClick={() => setTekenen(!tekenen)}
                  style={{ ...S.ghost, fontSize: 13, background: tekenen ? C.black : "transparent", color: tekenen ? "#fff" : C.black }}>
                  <Ico kind="potlood" />Tekenen {tekenen ? "aan" : "uit"}
                </button>
                {tekenen && ["#F2C230", "#FFFFFF", "#131313", "#D6001C"].map((k) => (
                  <button key={k} onClick={() => setPenKleur(k)} aria-label={`Penkleur ${k}`}
                    style={{ width: 30, height: 30, borderRadius: 99, background: k, cursor: "pointer", border: penKleur === k ? `3px solid ${C.in}` : `2px solid ${C.line}` }} />
                ))}
                {tekenen && <button onClick={wisTekening} style={{ ...S.ghost, fontSize: 13 }}>Wis</button>}
              </div>

              <div style={S.card}>
                <div style={{ fontSize: 13, color: C.inkSoft, marginBottom: 4 }}>
                  Keeper: <b style={{ color: C.ink }}>{keeper?.name ?? "—"}</b>
                  {" · "}Bank: <b style={{ color: C.ink }}>
                    {result.blocks[openBlock].bench.map((id) => playersById[id]?.name).join(", ") || "niemand"}
                  </b>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "3px 14px", fontSize: 14 }}>
                  {POSITIONS.map((pos) => {
                    const pl = playersById[result.blocks[openBlock].assign[pos.code]];
                    const hit = pl?.prefs.indexOf(pos.code);
                    return (
                      <div key={pos.code} style={{ display: "flex", justifyContent: "space-between", gap: 6 }}>
                        <span style={{ color: C.inkSoft }}>{pos.name}</span>
                        <span style={{ fontWeight: 700 }}>{pl?.name}{hit >= 0 && <sup style={{ color: C.in, fontWeight: 800 }}> {hit + 1}</sup>}</span>
                      </div>
                    );
                  })}
                </div>
                <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 8 }}>
                  Het cijfer achter de naam is de voorkeursrang (1 = eerste voorkeur).
                </div>
              </div>
            </>
          )}
        </main>
      )}

      {/* ── LIVE: coach-stopwatch ── */}
      {tab === "live" && (
        <main style={{ padding: 14, display: "grid", gap: 10 }}>
          {!result?.blocks && <div style={S.card}>Genereer eerst een schema, dan kun je hier de wedstrijd bijhouden.</div>}
          {result?.blocks && (
            <>
              <div style={{ ...S.card, background: C.black, border: "none", color: "#fff", textAlign: "center", padding: "20px 14px" }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 22 }}>
                  <svg viewBox="0 0 100 100" style={{ width: 108, flexShrink: 0 }} role="img"
                    aria-label={`Kwart ${Math.min(4, Math.floor(liveBlock / 2) + 1)} van 4`}>
                    {(() => {
                      const frac = Math.min(1, elapsed / totalSec);
                      const ang = frac * 2 * Math.PI - Math.PI / 2;
                      const px = 50 + 44 * Math.cos(ang), py = 50 + 44 * Math.sin(ang);
                      const large = frac > 0.5 ? 1 : 0;
                      const kwartNu = Math.min(4, Math.floor(liveBlock / 2) + 1);
                      return (
                        <>
                          <circle cx="50" cy="50" r="44" fill="rgba(255,255,255,.15)" />
                          {frac >= 1
                            ? <circle cx="50" cy="50" r="44" fill={C.bib} />
                            : frac > 0 && <path d={`M50,50 L50,6 A44,44 0 ${large} 1 ${px},${py} Z`} fill={C.bib} />}
                          <line x1="50" y1="6" x2="50" y2="94" stroke={C.black} strokeWidth="2.5" />
                          <line x1="6" y1="50" x2="94" y2="50" stroke={C.black} strokeWidth="2.5" />
                          <circle cx="50" cy="50" r="44" fill="none" stroke="#fff" strokeWidth="2.5" />
                          {[["K1", 70, 34], ["K2", 70, 74], ["K3", 30, 74], ["K4", 30, 34]].map(([t, tx, ty]) => (
                            <text key={t} x={tx} y={ty} textAnchor="middle" fontSize="11.5" fontWeight="800"
                              fill={kwartNu === Number(String(t).slice(1)) && elapsed < totalSec ? "#fff" : "rgba(255,255,255,.5)"}>{t}</text>
                          ))}
                          {[
                            [1, "M50,50 L50,6 A44,44 0 0 1 94,50 Z"],
                            [2, "M50,50 L94,50 A44,44 0 0 1 50,94 Z"],
                            [3, "M50,50 L50,94 A44,44 0 0 1 6,50 Z"],
                            [4, "M50,50 L6,50 A44,44 0 0 1 50,6 Z"],
                          ].map(([q, pad]) => (
                            <path key={q} d={pad} fill="transparent" style={{ cursor: "pointer" }}
                              onClick={() => springNaarKwart(q)} role="button"
                              aria-label={`Spring naar kwart ${q}`} />
                          ))}
                        </>
                      );
                    })()}
                  </svg>
                  <div>
                    <div style={{ fontSize: 13, opacity: 0.85 }}>Kwart {Math.min(4, Math.floor(liveBlock / 2) + 1)} · blok {BLOCKS[liveBlock]}</div>
                    <div style={{ ...S.display, color: "#fff", fontSize: 52, lineHeight: 1.1, fontVariantNumeric: "tabular-nums" }}>
                      {fmtClock(elapsed)}
                    </div>
                  </div>
                </div>
                <div style={{ background: "rgba(255,255,255,.25)", borderRadius: 99, height: 8, margin: "10px 0 6px" }}>
                  <div style={{ width: `${((elapsed - liveBlock * blockSec) / blockSec) * 100}%`, background: C.bib, height: 8, borderRadius: 99, transition: "width 1s linear" }} />
                </div>
                <div style={{ fontSize: 14 }}>
                  {elapsed >= totalSec ? "Einde wedstrijd" : liveBlock < 7 ? `Volgende wissel over ${fmtClock(restInBlock)}` : `Laatste blok — nog ${fmtClock(restInBlock)}`}
                </div>
                <div style={{ display: "flex", gap: 10, justifyContent: "center", marginTop: 14 }}>
                  <button onClick={() => {
                    if (!audioRef.current) { try { audioRef.current = new (window.AudioContext || window.webkitAudioContext)(); } catch { /* geen audio */ } }
                    if (audioRef.current?.resume) audioRef.current.resume();
                    setRunning(!running);
                  }} style={{ ...S.btn, background: running ? C.bib : "#fff", color: running ? C.bibInk : C.black, minWidth: 120 }}>
                    {running ? <><Ico kind="pauze" />Pauze</> : elapsed > 0 ? <><Ico kind="speel" />Hervat</> : <><Ico kind="speel" />Start</>}
                  </button>
                  <button onClick={() => { setRunning(false); setElapsed(0); }} style={{ ...S.ghost, borderColor: C.chalk, color: C.chalk }}><Ico kind="ververs" />Reset</button>
                </div>
                <div style={{ fontSize: 11.5, opacity: 0.7, marginTop: 8 }}>Pauzeer bij kwartrust — de klok telt alleen speeltijd. Piep bij 1 minuut, op het wisselmoment en bij het eindsignaal. Tik een kwart in de cirkel om de klok daarnaartoe te zetten.</div>
              </div>

              {/* Wedstrijd, score en turven */}
              <div style={S.card}>
                <div style={{ ...S.display, fontSize: 13, marginBottom: 8 }}><Ico kind="klok" />WEDSTRIJD</div>
                {matches.filter((m) => !m.gesloten).length === 0 ? (
                  <div style={{ fontSize: 13.5, color: C.inkSoft }}>Nog geen wedstrijd gepland — voeg er een toe op de Seizoen-tab.</div>
                ) : (
                  <>
                    <select value={activeMatchId} onChange={(e) => setActiveMatchId(e.target.value)}
                      style={{ ...S.select, width: "100%", boxSizing: "border-box" }} aria-label="Wedstrijd">
                      <option value="">Kies wedstrijd…</option>
                      {matches.filter((m) => !m.gesloten).map((m) => (
                        <option key={m.id} value={m.id}>{m.datum} · {m.thuis ? "thuis" : "uit"} · {m.tegenstander}</option>
                      ))}
                    </select>
                    <div style={{ display: "flex", alignItems: "baseline", justifyContent: "center", gap: 14, margin: "10px 0 8px" }}>
                      <span style={{ ...S.display, fontSize: 34 }}>{scoreVoor}</span>
                      <span style={{ color: C.inkSoft, fontSize: 20 }}>—</span>
                      <span style={{ ...S.display, color: C.ink, fontSize: 34 }}>{scoreTegen}</span>
                    </div>
                    <div style={{ display: "flex", gap: 7, flexWrap: "wrap", alignItems: "center" }}>
                      <select value={turfSpeler} onChange={(e) => setTurfSpeler(e.target.value)} style={S.select} aria-label="Speler voor doelpunt of kaart">
                        <option value="">Speler…</option>
                        {players.filter((p) => p.aanwezig).map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      <button onClick={turfDoelpunt} disabled={!turfSpeler} style={{ ...S.ghost, fontSize: 13, opacity: turfSpeler ? 1 : 0.45 }} aria-label="Doelpunt">+<MiniBal /></button>
                      <button onClick={() => turfKaart("gr")} disabled={!turfSpeler} style={{ ...S.ghost, fontSize: 13, opacity: turfSpeler ? 1 : 0.45 }} aria-label="Groene kaart"><MiniKaart kleur="#2E9E4F" /></button>
                      <button onClick={() => turfKaart("ge")} disabled={!turfSpeler} style={{ ...S.ghost, fontSize: 13, opacity: turfSpeler ? 1 : 0.45 }} aria-label="Gele kaart"><MiniKaart kleur="#F2C230" /></button>
                      <button onClick={() => turfKaart("ro")} disabled={!turfSpeler} style={{ ...S.ghost, fontSize: 13, opacity: turfSpeler ? 1 : 0.45 }} aria-label="Rode kaart"><MiniKaart kleur="#D6001C" /></button>
                      <button onClick={() => setScoreTegen(scoreTegen + 1)} style={{ ...S.ghost, fontSize: 13 }}>+ tegen</button>
                    </div>
                    {Object.keys(turf).length > 0 && (
                      <div style={{ fontSize: 13, color: C.inkSoft, marginTop: 8 }}>
                        {Object.entries(turf).map(([id, t]) => (
                          <span key={id} style={{ marginRight: 10, whiteSpace: "nowrap" }}>
                            <b style={{ color: C.ink }}>{playersById[id]?.name}</b>
                            {t.d ? <> {t.d}<MiniBal /></> : null}{t.gr ? <> {t.gr}<MiniKaart kleur="#2E9E4F" /></> : null}{t.ge ? <> {t.ge}<MiniKaart kleur="#F2C230" /></> : null}{t.ro ? <> {t.ro}<MiniKaart kleur="#D6001C" /></> : null}
                          </span>
                        ))}
                      </div>
                    )}
                    <button onClick={sluitWedstrijd} disabled={!activeMatchId}
                      style={{ ...S.ghost, fontSize: 13, marginTop: 10, color: C.bib, borderColor: C.bib, opacity: activeMatchId ? 1 : 0.45 }}>
                      Wedstrijd afsluiten en opslaan
                    </button>
                  </>
                )}
              </div>

              {/* Coach-tips via Claude */}
              <div style={S.card}>
                <div style={{ ...S.display, fontSize: 13, marginBottom: 8 }}><Ico kind="ai" />COACH-TIP</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                  {["Geen druk vooruit", "Achter de bal aan", "Corner tegen", "Te ver uit elkaar"].map((chip) => (
                    <button key={chip} onClick={() => setTipTekst((t) => (t ? t + ", " + chip.toLowerCase() : chip))}
                      style={{ ...S.ghost, fontSize: 12.5, padding: "6px 11px" }}>{chip}</button>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <input value={tipTekst} onChange={(e) => setTipTekst(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") vraagTips(); }}
                    placeholder="Steekwoorden… (dicteren kan met de microfoontoets)"
                    style={{ ...S.select, flex: 1, minWidth: 0 }} aria-label="Waarneming voor coachtip" />
                  <button onClick={vraagTips} disabled={tipsBezig || !tipTekst.trim()}
                    style={{ ...S.btn, padding: "10px 18px", fontSize: 15, opacity: tipsBezig || !tipTekst.trim() ? 0.5 : 1 }}>
                    {tipsBezig ? "…" : <><Ico kind="ai" />Tips</>}
                  </button>
                </div>
                {tipFout && <div style={{ fontSize: 13, color: C.out, fontWeight: 700, marginTop: 8 }}>{tipFout}</div>}
                {tips && (
                  <div style={{ marginTop: 10 }}>
                    {tips.map((t, i) => (
                      <div key={i} style={{ display: "flex", gap: 10, alignItems: "baseline", fontSize: 16.5, fontWeight: 600, padding: "5px 0", borderTop: i ? `1px solid ${C.line}` : "none" }}>
                        <span style={{ color: C.bib, fontWeight: 800 }}>{i + 1}</span>
                        <span>{t}</span>
                      </div>
                    ))}
                    <button onClick={() => { setTips(null); setTipTekst(""); }} style={{ ...S.ghost, fontSize: 12.5, marginTop: 8, padding: "6px 12px" }}>Wis</button>
                  </div>
                )}
              </div>

              {/* Ingelaste wissel */}
              <div style={S.card}>
                <div style={{ ...S.display, fontSize: 13, marginBottom: 8 }}><Ico kind="wissel" />INGELASTE WISSEL</div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                  <select value={adhocOut} onChange={(e) => setAdhocOut(e.target.value)} style={S.select} aria-label="Speler eruit">
                    <option value="">▼ Eruit…</option>
                    {Object.entries(result.blocks[liveBlock].assign).map(([pos, id]) => (
                      <option key={id} value={id}>{playersById[id]?.name} ({POS_BY_CODE[pos].name})</option>
                    ))}
                  </select>
                  <select value={adhocIn} onChange={(e) => setAdhocIn(e.target.value)} style={S.select} aria-label="Speler erin">
                    <option value="">▲ Erin…</option>
                    {result.blocks[liveBlock].bench.map((id) => (
                      <option key={id} value={id}>{playersById[id]?.name}</option>
                    ))}
                  </select>
                  <button onClick={() => wisselNu(Number(adhocOut), Number(adhocIn))}
                    disabled={!adhocOut || !adhocIn}
                    style={{ ...S.ghost, fontSize: 13, opacity: !adhocOut || !adhocIn ? 0.45 : 1 }}>
                    Wissel nu
                  </button>
                </div>
                <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 6 }}>
                  Geldt alleen voor dit blok; het geplande schema erna blijft staan. De wisselkaart hieronder past zich vanzelf aan.
                </div>
              </div>

              {/* Aanstaande wissels */}
              {liveBlock < 7 && elapsed < totalSec && (() => {
                const subs = subsBetween(result.blocks[liveBlock], result.blocks[liveBlock + 1], playersById);
                const bijna = restInBlock <= 60;
                return (
                  <div style={{ ...S.card, background: bijna ? C.bib : C.card, border: bijna ? "none" : `1px solid ${C.line}` }}>
                    <div style={{ ...S.display, fontSize: 13, marginBottom: 6, color: bijna ? C.bibInk : C.ink }}>
                      <Ico kind="wissel" />{bijna ? `ZO WISSELEN — NOG ${fmtClock(restInBlock)}` : `KLAARZETTEN VOOR ${BLOCKS[liveBlock + 1]}`}
                    </div>
                    {subs.length === 0 && <div style={{ fontSize: 14, color: C.inkSoft }}>Geen wissels bij het volgende blok.</div>}
                    {subs.map((sub, i) => (
                      <div key={i} style={{ display: "flex", gap: 8, alignItems: "baseline", fontSize: 16, padding: "3px 0", color: bijna ? C.bibInk : C.ink, flexWrap: "wrap" }}>
                        {sub.inId !== undefined && <>
                          <span style={{ fontWeight: 800, color: bijna ? "#fff" : C.in }}>▲ {playersById[sub.inId]?.name}</span>
                          <span>op {POS_BY_CODE[sub.pos].name}</span>
                        </>}
                        {sub.voorId !== undefined && (
                          <span style={{ fontWeight: 800, color: bijna ? "#fff" : C.out }}>▼ {playersById[sub.voorId]?.name}{sub.inId === undefined ? " eruit (niet vervangen)" : ""}</span>
                        )}
                      </div>
                    ))}
                  </div>
                );
              })()}

              {/* Huidige opstelling */}
              <div style={S.card}>
                <div style={{ ...S.display, fontSize: 13, marginBottom: 6 }}><Ico kind="veld" />NU OP HET VELD ({BLOCKS[liveBlock]})</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "3px 14px", fontSize: 14 }}>
                  {POSITIONS.map((pos) => {
                    const pl = playersById[result.blocks[liveBlock].assign[pos.code]];
                    return (
                      <div key={pos.code} style={{ display: "flex", justifyContent: "space-between", gap: 6 }}>
                        <span style={{ color: C.inkSoft }}>{pos.name}</span>
                        <span style={{ fontWeight: 700 }}>{pl?.name ?? "—"}</span>
                      </div>
                    );
                  })}
                </div>
                <div style={{ fontSize: 13, color: C.inkSoft, marginTop: 6 }}>
                  Bank: {result.blocks[liveBlock].bench.map((id) => playersById[id]?.name).join(", ") || "niemand"} · Keeper: {keeper?.name ?? "—"}
                </div>
              </div>
            </>
          )}
        </main>
      )}

      {/* ── SPEELTIJD ── */}
      {tab === "speeltijd" && (
        <main style={{ padding: 14, display: "grid", gap: 10 }}>
          {!result?.stats && <div style={S.card}>Genereer eerst een schema.</div>}
          {result?.stats && (
            <div style={S.card}>
              <div style={{ ...S.display, fontSize: 14, marginBottom: 10 }}><Ico kind="grafiek" />BLOKKEN PER SPELER</div>
              {players.filter((p) => p.aanwezig && !p.keeper).map((p) => {
                const st = result.stats[p.id] || { played: 0, prefHits: 0 };
                return (
                  <div key={p.id} style={{ marginBottom: 9 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                      <b>{p.name}</b>
                      <span style={{ color: C.inkSoft }}>
                        {st.played}/8 blokken · {st.prefHits}× voorkeur
                      </span>
                    </div>
                    <div style={{ background: C.line, borderRadius: 99, height: 8, marginTop: 3 }}>
                      <div style={{ width: `${(st.played / 8) * 100}%`, background: C.bib, height: 8, borderRadius: 99 }} />
                    </div>
                  </div>
                );
              })}
              <div style={{ fontSize: 12.5, color: C.inkSoft, marginTop: 6 }}>
                Elk blok is {halfMin} min. Verschil in speeltijd is nooit groter dan één blok.
              </div>
            </div>
          )}
        </main>
      )}

      {/* ── SEIZOEN ── */}
      {tab === "seizoen" && (
        <main style={{ padding: 14, display: "grid", gap: 10 }}>
          <div style={S.card}>
            <div style={{ ...S.display, fontSize: 13, marginBottom: 8 }}><Ico kind="kalender" />WEDSTRIJDSCHEMA</div>
            {matches.length === 0 && <div style={{ fontSize: 13.5, color: C.inkSoft, marginBottom: 8 }}>Nog geen wedstrijden ingevoerd.</div>}
            {matches.map((m) => (
              <div key={m.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", fontSize: 14 }}>
                  <span style={{ color: C.inkSoft, minWidth: 86 }}>{m.datum}</span>
                  <span style={{ flex: 1 }}><b>{m.tegenstander}</b> <span style={{ color: C.inkSoft }}>({m.thuis ? "thuis" : "uit"})</span></span>
                  {m.gesloten
                    ? <b style={{ color: C.bib }}>{m.voor}–{m.tegen}</b>
                    : <span style={{ color: C.inkSoft, fontSize: 12.5 }}>open</span>}
                  {m.gesloten && (
                    <button onClick={() => { setVerslagOpenId(verslagOpenId === m.id ? null : m.id); setVerslagWoorden(""); setVerslagFout(""); }}
                      style={{ ...S.ghost, padding: "4px 10px", fontSize: 12 }}><Ico kind="ai" m={4} />Verslag</button>
                  )}
                  <button onClick={() => setMatches(matches.filter((x) => x.id !== m.id))}
                    style={{ ...S.ghost, padding: "4px 9px", fontSize: 12, color: C.out, borderColor: C.out }}
                    aria-label={`Verwijder wedstrijd tegen ${m.tegenstander}`}>✕</button>
                </div>
                {m.gesloten && verslagOpenId === m.id && (
                  <div style={{ padding: "2px 0 12px" }}>
                    <div style={{ display: "flex", gap: 8 }}>
                      <input value={verslagWoorden} onChange={(e) => setVerslagWoorden(e.target.value)}
                        placeholder="Steekwoorden voor het verslag… (mag leeg)"
                        style={{ ...S.select, flex: 1, minWidth: 0 }} aria-label="Steekwoorden voor het verslag" />
                      <button onClick={() => maakVerslag(m)} disabled={verslagBezig}
                        style={{ ...S.ghost, fontSize: 13, opacity: verslagBezig ? 0.5 : 1 }}>
                        {verslagBezig ? "…" : "Schrijf"}
                      </button>
                    </div>
                    {verslagFout && <div style={{ fontSize: 13, color: C.out, fontWeight: 700, marginTop: 8 }}>{verslagFout}</div>}
                    {m.verslag && (
                      <>
                        <div style={{ fontSize: 14, lineHeight: 1.55, marginTop: 10, whiteSpace: "pre-wrap" }}>{m.verslag}</div>
                        <button onClick={async () => {
                          try { await navigator.clipboard.writeText(m.verslag); setSaveMsg("Verslag gekopieerd ✓ — plak hem in de ouderapp"); }
                          catch { setSaveMsg("Kopiëren lukte niet — selecteer de tekst handmatig"); }
                          setTimeout(() => setSaveMsg(""), 4000);
                        }} style={{ ...S.ghost, fontSize: 12.5, marginTop: 8, padding: "6px 12px" }}>Kopieer</button>
                      </>
                    )}
                  </div>
                )}
              </div>
            ))}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10 }}>
              <input type="date" value={nmDatum} onChange={(e) => setNmDatum(e.target.value)} style={S.select} aria-label="Datum" />
              <input value={nmTegen} onChange={(e) => setNmTegen(e.target.value)} placeholder="Tegenstander" style={{ ...S.select, flex: 1, minWidth: 110 }} aria-label="Tegenstander" />
              <button onClick={() => setNmThuis(!nmThuis)} style={{ ...S.ghost, fontSize: 13 }}>{nmThuis ? "Thuis" : "Uit"}</button>
              <button onClick={addMatch} disabled={!nmDatum || !nmTegen.trim()}
                style={{ ...S.ghost, fontSize: 13, opacity: !nmDatum || !nmTegen.trim() ? 0.45 : 1 }}>+ Wedstrijd</button>
            </div>
          </div>

          <div style={S.card}>
            <div style={{ ...S.display, fontSize: 13, marginBottom: 4 }}><Ico kind="grafiek" />SEIZOENSTOTALEN</div>
            <div style={{ fontSize: 12.5, color: C.inkSoft, marginBottom: 10 }}>
              Over {matches.filter((m) => m.gesloten).length} afgesloten wedstrijd(en). Wie achterloopt in blokken krijgt bij het genereren vanzelf voorrang.
            </div>
            {(() => {
              const rows = players.map((p) => {
                let b = 0, d = 0, gr = 0, ge = 0, ro = 0;
                matches.filter((m) => m.gesloten).forEach((m) => {
                  const s2 = m.stats?.[p.id]; if (!s2) return;
                  b += s2.b || 0; d += s2.d || 0; gr += s2.gr || 0; ge += s2.ge || 0; ro += s2.ro || 0;
                });
                return { p, b, d, gr, ge, ro };
              }).sort((a, z) => z.b - a.b);
              const max = Math.max(1, ...rows.map((r) => r.b));
              return rows.map(({ p, b, d, gr, ge, ro }) => (
                <div key={p.id} style={{ marginBottom: 8 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                    <b>{p.name}{p.keeper ? " (K)" : ""}</b>
                    <span style={{ color: C.inkSoft }}>
                      {b} blok{b === 1 ? "" : "ken"}{d ? <> · {d}<MiniBal /></> : null}{gr ? <> · {gr}<MiniKaart kleur="#2E9E4F" /></> : null}{ge ? <> · {ge}<MiniKaart kleur="#F2C230" /></> : null}{ro ? <> · {ro}<MiniKaart kleur="#D6001C" /></> : null}{(() => {
                        const gemist = matches.filter((m2) => m2.gesloten && m2.afwezig?.includes(p.name)).length;
                        return gemist ? <> · {gemist}x afwezig</> : null;
                      })()}
                    </span>
                  </div>
                  <div style={{ background: C.line, borderRadius: 99, height: 7, marginTop: 3 }}>
                    <div style={{ width: `${(b / max) * 100}%`, background: C.black, height: 7, borderRadius: 99 }} />
                  </div>
                </div>
              ));
            })()}
          </div>

          {/* Topscorers en kaarten over het seizoen */}
          {(() => {
            const rows = players.map((p) => {
              let d = 0, gr = 0, ge = 0, ro = 0;
              matches.filter((m) => m.gesloten).forEach((m) => {
                const s2 = m.stats?.[p.id]; if (!s2) return;
                d += s2.d || 0; gr += s2.gr || 0; ge += s2.ge || 0; ro += s2.ro || 0;
              });
              return { p, d, gr, ge, ro };
            });
            const scorers = rows.filter((r) => r.d > 0).sort((a, z) => z.d - a.d);
            const kaarten = rows.filter((r) => r.gr + r.ge + r.ro > 0)
              .sort((a, z) => (z.ro * 100 + z.ge * 10 + z.gr) - (a.ro * 100 + a.ge * 10 + a.gr));
            const maxD = Math.max(1, ...scorers.map((r) => r.d));
            return (
              <>
                <div style={S.card}>
                  <div style={{ ...S.display, fontSize: 13, marginBottom: 8 }}><Ico kind="beker" />TOPSCORERS</div>
                  {scorers.length === 0 && <div style={{ fontSize: 13.5, color: C.inkSoft }}>Nog geen doelpunten geturfd.</div>}
                  {scorers.map(({ p, d }, i) => (
                    <div key={p.id} style={{ marginBottom: 8 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                        <span><span style={{ color: C.inkSoft, marginRight: 8 }}>{i + 1}.</span><b>{p.name}</b></span>
                        <b>{d}<MiniBal /></b>
                      </div>
                      <div style={{ background: C.line, borderRadius: 99, height: 7, marginTop: 3 }}>
                        <div style={{ width: `${(d / maxD) * 100}%`, background: C.bib, height: 7, borderRadius: 99 }} />
                      </div>
                    </div>
                  ))}
                </div>

                <div style={S.card}>
                  <div style={{ ...S.display, fontSize: 13, marginBottom: 8 }}><Ico kind="kaart" />KAARTEN</div>
                  {kaarten.length === 0 && <div style={{ fontSize: 13.5, color: C.inkSoft }}>Nog geen kaarten — zo houden.</div>}
                  {kaarten.map(({ p, gr, ge, ro }) => (
                    <div key={p.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 14, padding: "4px 0", borderBottom: `1px solid ${C.line}` }}>
                      <b>{p.name}</b>
                      <span>{ro ? <>{ro}<MiniKaart kleur="#D6001C" /> </> : null}{ge ? <>{ge}<MiniKaart kleur="#F2C230" /> </> : null}{gr ? <>{gr}<MiniKaart kleur="#2E9E4F" /></> : null}</span>
                    </div>
                  ))}
                </div>
              </>
            );
          })()}
        </main>
      )}

      {/* ── PRINTBLAD (alleen zichtbaar bij afdrukken) ── */}
      {result?.blocks && (
        <section className="print-sheet" style={{ padding: 16, color: "#000", fontSize: 12, fontFamily: "system-ui, sans-serif" }}>
          <div style={{ fontWeight: 800, fontSize: 18 }}>Wisselschema</div>
          <div style={{ marginBottom: 10 }}>Keeper: {keeper?.name ?? "—"} · elk blok {halfMin} min · cijfer = voorkeursrang</div>
          {result.blocks.map((bl, i) => {
            const subs = i === 0 ? [] : subsBetween(result.blocks[i - 1], bl, playersById);
            return (
              <div key={bl.label} style={{ borderTop: "1px solid #999", padding: "5px 0", breakInside: "avoid" }}>
                <div style={{ fontWeight: 800 }}>{bl.label} <span style={{ fontWeight: 400 }}>(vanaf {fmtMin((i * kwartMin) / 2)} min)</span></div>
                {i === 0 ? (
                  <div>Start: {POSITIONS.map((pos) => `${pos.code} ${playersById[bl.assign[pos.code]]?.name ?? "—"}`).join("  ·  ")}</div>
                ) : subs.length === 0 ? (
                  <div>Geen wissels</div>
                ) : (
                  subs.map((sub, j) => (
                    <div key={j}>
                      {sub.inId !== undefined && <>▲ IN: {playersById[sub.inId]?.name} op {POS_BY_CODE[sub.pos].name} </>}
                      {sub.voorId !== undefined && <>— ▼ UIT: {playersById[sub.voorId]?.name}{sub.inId === undefined ? " (niet vervangen)" : ""}</>}
                    </div>
                  ))
                )}
                <div style={{ color: "#444" }}>Bank: {bl.bench.map((id) => playersById[id]?.name).join(", ") || "—"}</div>
              </div>
            );
          })}
        </section>
      )}

      {/* Vaste actiebalk */}
      <div className="actionbar" style={{ position: "fixed", bottom: 0, left: 0, right: 0, padding: "12px 14px 18px", background: `linear-gradient(transparent, ${C.chalk} 35%)`, pointerEvents: "none" }}>
        {saveMsg && (
          <div style={{ textAlign: "center", fontSize: 13, fontWeight: 700, color: saveMsg.includes("✓") ? C.in : C.out, marginBottom: 6 }}>
            {saveMsg}
          </div>
        )}
        <div style={{ display: "flex", gap: 8, justifyContent: "center", pointerEvents: "auto" }}>
          <button onClick={() => genereer(seed)} style={{ ...S.btn, flex: 1, maxWidth: 200, padding: "13px 14px" }}><Ico kind="wissel" />Genereer</button>
          <button onClick={() => opslaan()} style={{ ...S.ghost, alignSelf: "stretch", padding: "10px 14px" }}><Ico kind="opslaan" />Opslaan</button>
          {result?.blocks && (
            <>
              <button onClick={() => genereer(seed + 1)} style={{ ...S.ghost, alignSelf: "stretch", padding: "10px 12px" }} aria-label="Nieuwe variant"><Ico kind="ververs" m={0} /></button>
              <button onClick={() => window.print()} style={{ ...S.ghost, alignSelf: "stretch", padding: "10px 12px" }}><Ico kind="print" />Print</button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HockeyWisselCoach />);
</script>
</body>
</html>
