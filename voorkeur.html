<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Voorkeursposities — Coach Assistant</title>
<link rel="icon" type="image/png" href="/coach-assistant-icon-192.png">
<style>
  :root { --rood: #D6001C; --zwart: #131313; --krijt: #FAF9F6; --lijn: #E7E4DE; --veld: #1E5B41; --inkt: #191919; --zacht: #5F5B57; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--krijt); color: var(--inkt); font-family: system-ui, -apple-system, sans-serif; }
  header { background: var(--rood); color: #fff; padding: 16px 18px; border-radius: 0 0 22px 22px; display: flex; align-items: center; gap: 12px; }
  header img { width: 40px; height: 40px; border-radius: 10px; }
  header b { font-size: 19px; letter-spacing: -0.3px; }
  header span { display: block; font-size: 12.5px; opacity: .85; }
  main { padding: 16px 14px 40px; max-width: 480px; margin: 0 auto; }
  .kaart { background: #fff; border: 1px solid var(--lijn); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--rood); text-transform: uppercase; letter-spacing: .3px; }
  .namen { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .namen button, .knop { font: inherit; font-weight: 700; padding: 11px 8px; border-radius: 999px; border: 1.5px solid var(--zwart); background: transparent; color: var(--zwart); cursor: pointer; }
  .namen button.actief { background: var(--zwart); color: #fff; }
  .knop.vol { background: var(--zwart); color: #fff; width: 100%; padding: 14px; font-size: 16px; margin-top: 12px; }
  .knop.vol:disabled { opacity: .45; }
  svg { width: 100%; display: block; border-radius: 14px; touch-action: manipulation; }
  .uitleg { font-size: 13.5px; color: var(--zacht); margin: 0 0 10px; }
  .fout { color: #C2452D; font-weight: 700; font-size: 14px; margin-top: 10px; }
  .klaar { text-align: center; padding: 26px 10px; }
  .klaar .vink { font-size: 46px; color: var(--veld); }
  .keuze { font-size: 15px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <img src="/coach-assistant-icon-192.png" alt="">
  <div><b>COACH ASSISTANT</b><span>Jouw voorkeursposities</span></div>
</header>
<main id="main"><div class="kaart"><p class="uitleg">Laden…</p></div></main>
<script>
(async () => {
  const main = document.getElementById('main');
  const team = new URLSearchParams(location.search).get('team') || '';
  let info;
  try {
    const r = await fetch('/api/voorkeur/' + encodeURIComponent(team));
    if (!r.ok) throw new Error();
    info = await r.json();
  } catch {
    main.innerHTML = '<div class="kaart"><p class="uitleg">Deze link klopt niet of het team bestaat niet. Vraag je coach om een nieuwe link.</p></div>';
    return;
  }
  if (!info.spelers.length) {
    main.innerHTML = '<div class="kaart"><p class="uitleg">De spelerslijst staat nog niet op de server. Vraag je coach om eerst op Opslaan te drukken in de app.</p></div>';
    return;
  }

  let naam = null;
  let keuze = [];

  const teken = () => {
    const posSvg = info.posities.map((p) => {
      const cx = (p.x / 100) * 260 + 20, cy = (p.y / 100) * 320 + 20;
      const idx = keuze.indexOf(p.code);
      return `
        <g data-code="${p.code}" style="cursor:pointer">
          <circle cx="${cx}" cy="${cy}" r="20" fill="${idx >= 0 ? '#F2C230' : '#FAF9F6'}" stroke="#164733" stroke-width="1.6"/>
          <text x="${cx}" y="${cy - 1}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#191919">${p.code}</text>
          <text x="${cx}" y="${cy + 10}" text-anchor="middle" font-size="7.5" fill="#5F5B57">${p.naam.split(' ')[0]}</text>
          ${idx >= 0 ? `<circle cx="${cx + 15}" cy="${cy - 15}" r="9" fill="#D6001C"/><text x="${cx + 15}" y="${cy - 11.5}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">${idx + 1}</text>` : ''}
        </g>`;
    }).join('');
    main.innerHTML = `
      <div class="kaart">
        <h2>1. Wie ben je?</h2>
        <div class="namen">${info.spelers.map((s) => `<button class="${s === naam ? 'actief' : ''}" data-naam="${s}">${s}</button>`).join('')}</div>
      </div>
      <div class="kaart">
        <h2>2. Tik je 3 favoriete posities aan</h2>
        <p class="uitleg">In volgorde: je eerste tik is je favoriet. Nog eens tikken haalt hem weg.</p>
        <svg viewBox="0 0 300 360" role="img" aria-label="Hockeyveld met posities">
          <rect width="300" height="360" fill="#1E5B41" rx="14"/>
          <rect x="10" y="10" width="280" height="340" rx="6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
          <line x1="10" y1="180" x2="290" y2="180" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
          <path d="M 80 10 A 70 70 0 0 0 220 10" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
          <path d="M 80 350 A 70 70 0 0 1 220 350" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
          ${posSvg}
        </svg>
        <button class="knop vol" id="verstuur" ${!naam || keuze.length === 0 ? 'disabled' : ''}>
          ${!naam ? 'Kies eerst je naam' : keuze.length < 3 ? `Versturen (${keuze.length} van 3 gekozen)` : 'Versturen'}
        </button>
        <div class="fout" id="fout"></div>
      </div>`;
    main.querySelectorAll('[data-naam]').forEach((b) => b.onclick = () => { naam = b.dataset.naam; teken(); });
    main.querySelectorAll('[data-code]').forEach((g) => g.onclick = () => {
      const c = g.dataset.code;
      if (keuze.includes(c)) keuze = keuze.filter((x) => x !== c);
      else if (keuze.length < 3) keuze.push(c);
      teken();
    });
    document.getElementById('verstuur').onclick = async () => {
      const knop = document.getElementById('verstuur');
      knop.disabled = true; knop.textContent = 'Versturen…';
      try {
        const r = await fetch('/api/voorkeur/' + encodeURIComponent(team), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ speler: naam, posities: keuze }),
        });
        if (!r.ok) throw new Error();
        const naamPos = (c) => info.posities.find((p) => p.code === c).naam;
        main.innerHTML = `
          <div class="kaart klaar">
            <div class="vink">\u2713</div>
            <h2 style="text-transform:none">Doorgegeven, ${naam}!</h2>
            <div class="keuze">${keuze.map((c, i) => `${i + 1}. ${naamPos(c)}`).join('<br>')}</div>
            <button class="knop vol" id="opnieuw">Toch aanpassen</button>
          </div>`;
        document.getElementById('opnieuw').onclick = () => teken();
      } catch {
        document.getElementById('fout').textContent = 'Versturen mislukte — probeer het nog eens.';
        knop.disabled = false; knop.textContent = 'Versturen';
      }
    };
  };
  teken();
})();
</script>
</body>
</html>
