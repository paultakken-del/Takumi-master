name: verslag-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::add-mask::2026"
          node -e '
          (async () => {
            const r = await fetch("https://takumi-master.com/api/verslag", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code: "jo16-5", pin: process.env.WC_PIN,
                wedstrijd: { datum: "2026-09-05", tegenstander: "Laren JO16-4", thuis: true, voor: 3, tegen: 2 },
                scorers: [{ naam: "Teun", n: 2 }, { naam: "Pim", n: 1 }],
                steekwoorden: "sterke tweede helft, goed uitverdedigd, corner benut" })
            });
            const fout = await fetch("https://takumi-master.com/api/verslag", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code: "jo16-5", pin: "0000", wedstrijd: {} })
            });
            const d = r.ok ? await r.json() : {};
            const v = d.verslag || "";
            const verboden = ["aftrap", "penalty", "buitenspel", "doeltrap"].filter(w => v.toLowerCase().includes(w));
            const namenOk = v.includes("Teun") && v.includes("Pim") && v.includes("3-2");
            console.log("RESULTAAT:", r.status, "lengte:", v.length, "| foute pin:", fout.status, "| namen+uitslag:", namenOk, verboden.length ? "| VOETBAL: " + verboden : "| hockeytaal OK");
            console.log("---\n" + v + "\n---");
            if (!r.ok || v.length < 200 || fout.status !== 403 || verboden.length || !namenOk) process.exit(1);
          })();
          '
        env:
          WC_PIN: "2026"
