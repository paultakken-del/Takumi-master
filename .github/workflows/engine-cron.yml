name: Takumi Engine weekronde
on:
  schedule:
    - cron: "53 5 * * 1"  # maandag ~07:53 NL — ná de weekclose (ma 00:00 UTC) en de zondagweging van de radar
  workflow_dispatch: {}
jobs:
  weekronde:
    runs-on: ubuntu-latest
    steps:
      - name: Weekronde draaien
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/uit.json -w "%{http_code}" \
            -X POST https://takumi-master.com/api/engine \
            -H "content-type: application/json" \
            -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
            -d '{"stap":"weekronde"}')
          echo "weekronde HTTP $code"
          cut -c1-800 /tmp/uit.json; echo
          [ "$code" = "200" ]
