name: Takumi Engine weekronde
on:
  schedule:
    - cron: "23 5 * * *"  # dagelijks ~07:23 NL: dagwacht (alleen bescherming, koopt nooit)
    - cron: "53 5 * * 1"  # maandag ~07:53 NL: weekrondes, na weekclose en zondagweging
  workflow_dispatch: {}
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Sleutelcontrole
        run: |
          L=${#RADAR_KEY}
          echo "::error title=sleutel::RADAR_KEY lengte $L"
          [ "$L" -gt 0 ]
        env:
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
      - name: Dagwacht (stop-bewaking BTC)
        if: github.event.schedule == '23 5 * * *'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/uit.json -w "%{http_code}" \
            -X POST https://takumi-master.com/api/engine \
            -H "content-type: application/json" \
            -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
            -d '{"stap":"dagwacht"}')
          echo "dagwacht HTTP $code"; cut -c1-600 /tmp/uit.json; echo
          if [ "$code" != "200" ]; then echo "::error title=dagwacht::HTTP $code $(cut -c1-300 /tmp/uit.json)"; exit 1; fi
      - name: Trendcache voorverwarmen
        if: github.event.schedule == '53 5 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -X POST https://takumi-master.com/api/engine \
            -H "content-type: application/json" -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
            -d '{"stap":"etf-diagnose","fase":"trend"}' -o /tmp/t.json -w "voorverwarm HTTP %{http_code}\n" || true
          cut -c1-200 /tmp/t.json; echo
      - name: Weekronde BTC
        if: github.event.schedule == '53 5 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/uit.json -w "%{http_code}" \
            -X POST https://takumi-master.com/api/engine \
            -H "content-type: application/json" \
            -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
            -d '{"stap":"weekronde"}')
          echo "weekronde HTTP $code"; cut -c1-800 /tmp/uit.json; echo
          if [ "$code" != "200" ]; then echo "::error title=weekronde::HTTP $code $(cut -c1-300 /tmp/uit.json)"; exit 1; fi
      - name: Weekronde ETF
        if: github.event.schedule == '53 5 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          for poging in 1 2; do
            code=$(curl -sS -o /tmp/uit.json -w "%{http_code}" \
              -X POST https://takumi-master.com/api/engine \
              -H "content-type: application/json" \
              -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
              -d '{"stap":"weekronde-etf"}')
            [ "$code" = "200" ] && break
            echo "poging $poging: HTTP $code, herkansing over 45s"; sleep 45
          done
          echo "weekronde-etf HTTP $code"; cut -c1-800 /tmp/uit.json; echo
          if [ "$code" != "200" ]; then echo "::error title=weekronde-etf::HTTP $code $(cut -c1-300 /tmp/uit.json)"; exit 1; fi
      - name: Koopladder
        if: github.event.schedule == '53 5 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          for poging in 1 2; do
            code=$(curl -sS -o /tmp/uit.json -w "%{http_code}" \
              -X POST https://takumi-master.com/api/engine \
              -H "content-type: application/json" \
              -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
              -d '{"stap":"koopladder"}')
            [ "$code" = "200" ] && break
            echo "poging $poging: HTTP $code, herkansing over 45s"; sleep 45
          done
          echo "koopladder HTTP $code"; cut -c1-800 /tmp/uit.json; echo
          if [ "$code" != "200" ]; then echo "::error title=koopladder::HTTP $code $(cut -c1-300 /tmp/uit.json)"; exit 1; fi
