name: wc-import
on: workflow_dispatch
jobs:
  importeer:
    runs-on: ubuntu-latest
    steps:
      - name: Wedstrijdschema JO16-5 herstellen
        run: |
          echo "::add-mask::2026"
          cat > /tmp/import.mjs << 'EOF'
          const NIEUW = [
            { datum: "2026-09-05", tegenstander: "Laren JO16-4", thuis: true },
            { datum: "2026-09-12", tegenstander: "Naarden JO16-5", thuis: false },
            { datum: "2026-09-19", tegenstander: "Maarssen JO16-4", thuis: true },
            { datum: "2026-09-26", tegenstander: "Loenen JO16-2", thuis: false },
            { datum: "2026-10-03", tegenstander: "Lelystad JO16-1", thuis: true },
            { datum: "2026-10-10", tegenstander: "Laren JO16-4", thuis: false },
            { datum: "2026-10-31", tegenstander: "Naarden JO16-5", thuis: true },
            { datum: "2026-11-07", tegenstander: "Maarssen JO16-4", thuis: false },
            { datum: "2026-11-14", tegenstander: "Loenen JO16-2", thuis: true },
            { datum: "2026-11-21", tegenstander: "Lelystad JO16-1", thuis: false },
          ];
          const base = "https://takumi-master.com/api/team/jo16-5";
          const pin = process.env.WC_PIN;
          const g = await fetch(`${base}?pin=${pin}`);
          let state = {};
          if (g.ok) state = JSON.parse((await g.json()).state);
          else if (g.status !== 404) { console.log("RESULTAAT: GET faalde", g.status); process.exit(1); }
          const bestaand = Array.isArray(state.matches) ? state.matches : [];
          const sleutel = (m) => `${m.datum}|${(m.tegenstander || "").toLowerCase()}`;
          const heeft = new Set(bestaand.map(sleutel));
          let toegevoegd = 0;
          NIEUW.forEach((m, i) => {
            if (!heeft.has(sleutel(m))) { bestaand.push({ id: Date.now() + i, gesloten: false, ...m }); toegevoegd++; }
          });
          bestaand.sort((a, z) => (a.datum > z.datum ? 1 : -1));
          state.matches = bestaand;
          const p = await fetch(base, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin, state: JSON.stringify(state) }) });
          if (!p.ok) { console.log("RESULTAAT: PUT faalde", p.status); process.exit(1); }
          const check = JSON.parse((await (await fetch(`${base}?pin=${pin}`)).json()).state);
          if (!Array.isArray(check.matches) || check.matches.length < 10) { console.log("RESULTAAT: verificatie faalde"); process.exit(1); }
          console.log(`RESULTAAT: toegevoegd=${toegevoegd} totaal=${check.matches.length}`);
          EOF
          WC_PIN=2026 node /tmp/import.mjs
