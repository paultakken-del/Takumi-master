name: Takumi probe
on:
  workflow_dispatch:
    inputs:
      klimaatForceer:
        type: boolean
        default: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Klimaat opnieuw meten (alleen op verzoek)
        if: inputs.klimaatForceer
        run: |
          curl -sS -X POST https://takumi-master.com/api/radar \
            -H "content-type: application/json" -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
            -d '{"stap":"klimaat","forceer":true}' -o /tmp/kf.json -w "klimaat-forceer HTTP %{http_code}\n"
          echo "::error title=klimaat-forceer::$(cut -c1-300 /tmp/kf.json)"
      - name: ETF-fasediagnose
        run: |
          for fase in trend herwaardeer; do
            code=$(curl -sS -o /tmp/d.json -w "%{http_code}" -X POST https://takumi-master.com/api/engine \
              -H "content-type: application/json" -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
              -d "{\"stap\":\"etf-diagnose\",\"fase\":\"$fase\"}")
            echo "::error title=fase-$fase::HTTP $code $(cut -c1-200 /tmp/d.json)"
          done
      - name: Radar en engine uitlezen
        run: |
          curl -sS https://takumi-master.com/api/radar -o /tmp/r.json || true
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/r.json'))
          except Exception as e:
              print(f"::error title=radar::onleesbaar {e}"); raise SystemExit(0)
          m = d.get('meting') or {}
          s = m.get('sleutels') or {}
          c = (m.get('crypto') or {})
          mac = (m.get('macro') or {})
          print(f"::error title=sleutels::FRED={s.get('fred')} RADAR={s.get('radar')}")
          print(f"::error title=crypto::btc={c.get('btc')} eth={c.get('eth')} dom={c.get('dominantie')} fng={c.get('fng')} stables={c.get('stables')}")
          print(f"::error title=liquiditeit::netliq={mac.get('netliq')} nfci={mac.get('nfci')} dxy={mac.get('dxy')} etf={m.get('etfAantal')}")
          print(f"::error title=klimaat::{json.dumps(d.get('klimaat'))[:220]}")
          print(f"::error title=meetfouten::{json.dumps(m.get('fouten'))[:250]}")
          PY
          curl -sS https://takumi-master.com/api/ping -o /tmp/p.json || true
          echo "::error title=ping::$(cut -c1-250 /tmp/p.json)"
          code=$(curl -sS -o /tmp/e.json -w "%{http_code}" https://takumi-master.com/api/engine)
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/e.json'))
          print(f"::error title=structuur::{sorted(d.keys())}")
          for k, v in d.items():
              if isinstance(v, dict):
                  print(f"::error title=sub-{k}::{sorted(v.keys())[:12]}")
              if isinstance(v, list) and v:
                  print(f"::error title=lijst-{k}::laatste={json.dumps(v[-1], ensure_ascii=False)[:200]}")
          btc = d.get('portfolio') or {}
          print(f"::error title=btc::saldo {btc.get('saldoEUR')} btc {btc.get('btc')} prijs {d.get('prijs')}")
          etf = d.get('etf') or {}
          for L in (etf.get('logboek') or [])[-2:]:
              print(f"::error title=etf-log::{L.get('tijd','')[:16]} {L.get('actie')} {str(L.get('melding') or L.get('reden'))[:180]}")
          lad = d.get('koopladder') or {}
          for L in (lad.get('logboek') or [])[-1:]:
              print(f"::error title=ladder-log::{L.get('tijd','')[:16]} {L.get('actie')} {str(L.get('melding') or L.get('reden'))[:180]}")
          PY
