name: Cyclusradar maandagsignaal
on:
  schedule:
    - cron: "30 5 * * 1"   # maandag 07:30 NL (zomertijd)
  workflow_dispatch: {}
jobs:
  signalen:
    runs-on: ubuntu-latest
    steps:
      - name: Beide signalen (research -> signaal)
        run: |
          for soort in macro crypto; do
            R=$(curl -fsS -X POST https://takumi-master.com/api/radar \
              -H "content-type: application/json" \
              -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
              -d "{\"soort\":\"$soort\",\"stap\":\"research\"}" | jq -r '.research')
            jq -n --arg s "$soort" --arg r "$R" '{soort:$s, stap:"signaal", research:$r}' | \
            curl -fsS -X POST https://takumi-master.com/api/radar \
              -H "content-type: application/json" \
              -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
              -d @- | head -c 200
            echo; sleep 15
          done
