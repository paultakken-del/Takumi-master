name: Cyclusradar metingen en signalen
on:
  schedule:
    - cron: "23 3 * * *"   # dagelijks ~05:23 NL: meting (oneven minuut tegen GitHub-drukte)
    - cron: "37 18 * * 0"  # zondag ~20:37 NL: weeksignalen, ruim voor de maandagbriefing
  workflow_dispatch:
    inputs:
      signalen:
        description: "Ook signalen genereren (kost AI-aanroepen)"
        type: boolean
        default: false
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Dagelijkse meting
        run: |
          set -euo pipefail
          curl -sS -o /tmp/uit.json -w "meting HTTP %{http_code}\n" \
            -X POST https://takumi-master.com/api/radar \
            -H "content-type: application/json" \
            -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
            -d '{"stap":"meting"}'
          cut -c1-400 /tmp/uit.json; echo
      - name: Klimaatmeting (kwartaal; server beslist)
        run: |
          set -euo pipefail
          curl -sS -o /tmp/k.json -w "klimaat HTTP %{http_code}\n" \
            -X POST https://takumi-master.com/api/radar \
            -H "content-type: application/json" \
            -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
            -d '{"stap":"klimaat"}' || true
          cut -c1-300 /tmp/k.json; echo
      - name: Maandagsignalen
        if: github.event.schedule == '37 18 * * 0' || inputs.signalen
        run: |
          set -euo pipefail
          for soort in macro crypto; do
            code=$(curl -sS -o /tmp/uit.json -w "%{http_code}" \
              -X POST https://takumi-master.com/api/radar \
              -H "content-type: application/json" \
              -H "x-radar-key: ${{ secrets.RADAR_KEY }}" \
              -d "{\"stap\":\"signaal\",\"soort\":\"$soort\"}")
            echo "signaal $soort HTTP $code"; cut -c1-400 /tmp/uit.json; echo
            if [ "$code" != "200" ] && [ "$code" != "429" ]; then exit 1; fi
            sleep 10
          done
